# Grafana for observability#2 (ADR 0014) and observability#4 (ADR 0017).
# Own `grafana` namespace (no credential shared with Prometheus,
# self-contained admin secret, same pattern as Kafka/Postgres). No PVC:
# entire state here is code-provisioned (datasources + dashboards),
# nothing to lose on restart.
#
# repoURL points at grafana-community/helm-charts, not the original
# grafana/helm-charts -- the upstream chart is `deprecated: true` as of
# this writing, migrating to grafana-community after Jan 30th 2026 (a
# date already past). Verified before switching: grafana-community
# publishes the same chart (fullnameOverride/persistence/datasources
# values schema unchanged), at a newer version (12.8.0, appVersion
# 13.1.1, published 2026-07-21) than the deprecated repo's last release
# (10.5.15) -- a real continuation, not a stale mirror.
#
# Components without their own dashboard, and why (backlog #109, same
# reasoning as ADR 0020's own "Components without their own row"
# section, adamastorx repo): clinvar-viewer/visualizer are static
# frontends with no backend of their own to have a golden signal for;
# workload-generator is synthetic traffic infrastructure, not a
# service with its own dashboard-worthy signal. Stated here so
# scripts/check-roster-drift.sh's grace-period check (backlog #109)
# can find the reason the same way it finds a real dashboard.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 12.8.0
    helm:
      valuesObject:
        fullnameOverride: grafana
        # backlog #114: found live 2026-08-07 -- no resources block since
        # this chart's first deploy (ADR 0014). Real measured usage
        # (`kubectl top pod`) ~12m CPU/168Mi memory (dashboard rendering
        # is the real memory driver here, not baseline idle) -- sized
        # with headroom above that, same "never unconstrained" convention
        # as every other component here.
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 384Mi
        persistence:
          enabled: false
        # existingSecret migration (platform#36, extended here): admin
        # credential used to be left to the chart's own auto-generation
        # (common.secrets.passwords.manage), which is non-idempotent
        # under ArgoCD's `helm template`-only rendering -- confirmed live
        # (the same root cause already fixed for postgresql/redis/
        # clinvar-postgresql/kafka). existingSecret points at a Secret
        # this chart can no longer create or regenerate; userKey/
        # passwordKey stay at the chart's own defaults (admin-user/
        # admin-password), the same key names the chart-generated Secret
        # already used, so the live Secret needs no rename. Provisioning:
        # bootstrap/README.md and bootstrap/create-stateful-secrets.sh.
        admin:
          existingSecret: grafana
        # Fixed local address (backlog: no more port-forward for
        # day-to-day access) -- same adamastorx-ca ClusterIssuer/Traefik
        # pattern api's own Ingress uses (ADR 0021). No public DNS yet
        # (ADR 0004), so this only resolves locally: add a /etc/hosts
        # entry pointing grafana.local.adamastorx.test at the node's IP.
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: adamastorx-ca
          hosts:
            - grafana.local.adamastorx.test
          tls:
            - secretName: grafana-tls
              hosts:
                - grafana.local.adamastorx.test
        # Provisioned datasources, not manually-clicked-in ones -- code,
        # not clickops. Prometheus Service name confirmed by rendering
        # its chart locally (fullnameOverride: prometheus still yields
        # a "-server" suffixed Service, the chart's own component-name
        # convention).
        #
        # Loki<->Tempo correlation (ADR 0015): the services already
        # print a `[<traceId>-<spanId>]` bracket on every log line once
        # a trace is active (Boot's default correlation pattern, ADR
        # 0013) -- confirmed by triggering a real request and reading
        # the literal bracket format from `workers`' log output, not
        # assumed. Loki's derivedFields regex extracts the 32-hex
        # traceId from that exact bracket and links to Tempo; Tempo's
        # tracesToLogsV2 links back to Loki, filtered by time window
        # only (no traceID label exists on these log streams).
        # Deliberately no serviceMap (needs Tempo's metricsGenerator,
        # left disabled -- a remote_write dependency this issue doesn't
        # need) and no metric->trace exemplar link (needs Prometheus
        # native histograms + a Micrometer exemplar bridge on all three
        # services, tracked separately as backlog #19a).
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                url: http://prometheus-server.prometheus.svc.cluster.local
                access: proxy
                isDefault: true
              - name: Loki
                uid: loki
                type: loki
                url: http://loki.loki.svc.cluster.local:3100
                access: proxy
                jsonData:
                  derivedFields:
                    - datasourceUid: tempo
                      matcherRegex: '\[([0-9a-f]{32})-[0-9a-f]{16}\]'
                      name: TraceID
                      url: '$${__value.raw}'
                      urlDisplayLabel: 'View Trace'
              - name: Tempo
                uid: tempo
                type: tempo
                url: http://tempo.tempo.svc.cluster.local:3200
                access: proxy
                jsonData:
                  tracesToLogsV2:
                    datasourceUid: loki
                    spanStartTimeShift: '-1h'
                    spanEndTimeShift: '1h'
                    filterByTraceID: false
                    filterBySpanID: false
                  # backlog #57: tracesToProfiles wires the datasource
                  # connection (service.name/service.namespace tag mapping
                  # to Pyroscope, so a span's own resource attributes are
                  # what selects the matching profile series) -- this part
                  # is real and live: api/clinvar-service already emit
                  # those resource attributes on every span (ADR 0013),
                  # and Pyroscope's profiles below are labelled with the
                  # matching `service_name` (rollout.yaml/deployment.yaml's
                  # PYROSCOPE_APPLICATION_NAME). **Stated gap, not assumed
                  # working**: Grafana's own docs are explicit that the
                  # actual clickable trace-to-profile link (the
                  # `pyroscope.profile.id` span attribute a slow span
                  # needs to open a flame graph scoped to that exact span)
                  # requires a language-specific OTel span-processor
                  # *bridge package* running inside the profiled process
                  # (e.g. Java's io.pyroscope:otel, Python's
                  # pyroscope-otel) -- neither service has that wired in
                  # (both are profiled via the unprivileged init-container
                  # SDK injection in rollout.yaml/deployment.yaml, not a
                  # full in-code OTel integration). This datasource
                  # wiring is a real prerequisite for that follow-up, not
                  # a claim that span-level correlation already works --
                  # not independently click-verified against a real trace
                  # this session; a human should check this post-merge.
                  tracesToProfiles:
                    datasourceUid: pyroscope
                    tags:
                      - key: service.name
                        value: service_name
                    profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
              - name: Pyroscope
                uid: pyroscope
                type: grafana-pyroscope-datasource
                url: http://pyroscope.pyroscope.svc.cluster.local:4040
                access: proxy
              # backlog #108 (ADR 0038): second datasource, alongside
              # (not replacing) Prometheus -- Mimir speaks the same
              # Prometheus query API under its own /prometheus prefix
              # (confirmed live via the real mimir binary's own -help-all
              # output, -http.prometheus-http-prefix default "/prometheus",
              # not guessed). isDefault stays on the plain Prometheus
              # datasource above; this one is opt-in per query/dashboard.
              - name: Mimir
                uid: mimir
                type: prometheus
                url: http://mimir.mimir.svc.cluster.local:8080/prometheus
                access: proxy
        # Dashboards as code (observability#4, backlog #20, ADR 0017) --
        # golden signals (latency, traffic, errors, saturation) for each of
        # api/workers, one dashboard per service. File-based
        # provisioning (dashboardProviders + dashboards keys), not the
        # chart's sidecar -- verified by rendering this exact chart/version
        # locally first: dashboardProviders below becomes Grafana's
        # provisioning/dashboards/dashboardproviders.yaml, and each entry
        # under dashboards.golden-signals.*.json becomes its own ConfigMap
        # key, mounted by the chart straight into
        # /var/lib/grafana/dashboards/golden-signals/<name>.json -- no
        # extra sidecar container, no extra RBAC, same reasoning ADR 0011/
        # 0014 already used to reject an Operator for one static workload.
        # PromQL in each panel is built from metric names/labels confirmed
        # against a live Prometheus query, not assumed from docs -- see ADR
        # 0017 for the dashboards-before-alerts tension it resolves
        # explicitly rather than silently, and for the two gaps it shipped
        # with and named directly: no latency percentiles (Boot's
        # histogram buckets weren't enabled) and no real Kafka
        # consumer-lag metric for workers (a thread-pool-usage panel stood
        # in as a stated proxy). Both are now closed (observability#15,
        # ADR 0020) -- api/workers' Latency panels plot a real
        # histogram_quantile(0.95, ...) and workers' Saturation panel
        # plots the real kafka_consumer_fetch_manager_records_lag_max,
        # each confirmed present on a live /actuator/prometheus scrape
        # before this dashboard JSON was changed (see the services repo's
        # ApiMetricsHistogramTest/WorkersMetricsHistogramTest). `gateway`'s
        # GatewayMetricsHistogramTest and golden-signals dashboard were
        # removed by ADR 0021/backlog #S1 along with `gateway` itself.
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: golden-signals
                orgId: 1
                folder: 'Golden Signals'
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/golden-signals
        dashboards:
          golden-signals:
            api-golden-signals:
              json: |
                {
                  "uid": "api-golden-signals",
                  "title": "api \u2014 Golden Signals",
                  "tags": [
                    "golden-signals",
                    "api"
                  ],
                  "timezone": "browser",
                  "schemaVersion": 39,
                  "version": 1,
                  "editable": false,
                  "time": {
                    "from": "now-6h",
                    "to": "now"
                  },
                  "refresh": "30s",
                  "panels": [
                    {
                      "id": 1,
                      "title": "Traffic \u2014 request rate",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 0,
                        "y": 0,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "reqps"
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(rate(http_server_requests_seconds_count{job=\"api\", uri!~\"/actuator.*\"}[$__rate_interval]))",
                          "legendFormat": "requests/s"
                        }
                      ]
                    },
                    {
                      "id": 2,
                      "title": "Latency \u2014 p95 request duration",
                      "description": "Real histogram_quantile(0.95, ...) over http_server_requests_seconds_bucket (observability#15, ADR 0020) \u2014 replaces the average/max stand-in ADR 0017 shipped with while Boot's percentiles-histogram property was still off. Verified: a real _bucket series was confirmed present on a live /actuator/prometheus scrape (ApiMetricsHistogramTest) before this panel was changed.",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 12,
                        "y": 0,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "s"
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job=\"api\", uri!~\"/actuator.*\"}[$__rate_interval])) by (le))",
                          "legendFormat": "p95 duration"
                        }
                      ]
                    },
                    {
                      "id": 3,
                      "title": "Errors \u2014 total vs. server-error request rate",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 0,
                        "y": 8,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "reqps"
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(rate(http_server_requests_seconds_count{job=\"api\", uri!~\"/actuator.*\"}[$__rate_interval]))",
                          "legendFormat": "total"
                        },
                        {
                          "refId": "B",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(rate(http_server_requests_seconds_count{job=\"api\", uri!~\"/actuator.*\", outcome=\"SERVER_ERROR\"}[$__rate_interval]))",
                          "legendFormat": "5xx errors"
                        }
                      ]
                    },
                    {
                      "id": 4,
                      "title": "Errors \u2014 5xx ratio (current)",
                      "type": "stat",
                      "gridPos": {
                        "x": 12,
                        "y": 8,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "percentunit",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {
                                "color": "green",
                                "value": null
                              },
                              {
                                "color": "yellow",
                                "value": 0.01
                              },
                              {
                                "color": "red",
                                "value": 0.05
                              }
                            ]
                          }
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(rate(http_server_requests_seconds_count{job=\"api\", uri!~\"/actuator.*\", outcome=\"SERVER_ERROR\"}[$__rate_interval])) / clamp_min(sum(rate(http_server_requests_seconds_count{job=\"api\", uri!~\"/actuator.*\"}[$__rate_interval])), 1e-9)",
                          "legendFormat": "5xx ratio"
                        }
                      ]
                    },
                    {
                      "id": 5,
                      "title": "Saturation \u2014 JVM heap used",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 0,
                        "y": 16,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "percentunit",
                          "max": 1,
                          "min": 0
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(jvm_memory_used_bytes{job=\"api\", area=\"heap\"}) / sum(jvm_memory_max_bytes{job=\"api\", area=\"heap\"})",
                          "legendFormat": "heap used"
                        }
                      ]
                    },
                    {
                      "id": 6,
                      "title": "Saturation \u2014 HikariCP pool usage (Postgres)",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 12,
                        "y": 16,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "percentunit",
                          "max": 1,
                          "min": 0
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(hikaricp_connections_active{job=\"api\"}) / sum(hikaricp_connections_max{job=\"api\"})",
                          "legendFormat": "pool used"
                        }
                      ]
                    }
                  ]
                }
            workers-golden-signals:
              json: |
                {
                  "uid": "workers-golden-signals",
                  "title": "workers \u2014 Golden Signals",
                  "description": "workers has no business HTTP API (ADR 0009/0011) \u2014 traffic/latency/errors come from the spring.kafka.listener timer instead of http_server_requests.",
                  "tags": [
                    "golden-signals",
                    "workers"
                  ],
                  "timezone": "browser",
                  "schemaVersion": 39,
                  "version": 1,
                  "editable": false,
                  "time": {
                    "from": "now-6h",
                    "to": "now"
                  },
                  "refresh": "30s",
                  "panels": [
                    {
                      "id": 1,
                      "title": "Traffic \u2014 messages consumed rate (work-items)",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 0,
                        "y": 0,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "ops"
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(rate(spring_kafka_listener_seconds_count{job=\"workers\"}[$__rate_interval]))",
                          "legendFormat": "messages/s"
                        }
                      ]
                    },
                    {
                      "id": 2,
                      "title": "Latency \u2014 p95 message processing time",
                      "description": "Real histogram_quantile(0.95, ...) over spring_kafka_listener_seconds_bucket (observability#15, ADR 0020) \u2014 replaces the average/max stand-in ADR 0017 shipped with. WorkItemConsumerConfig's listener container factory is hand-built (ADR 0011), but the percentiles-histogram property is a MeterFilter keyed on meter name, applied registry-wide regardless of which bean produced the meter \u2014 verified: a real _bucket series was confirmed present on a live /actuator/prometheus scrape (WorkersMetricsHistogramTest) before this panel was changed.",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 12,
                        "y": 0,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "s"
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "histogram_quantile(0.95, sum(rate(spring_kafka_listener_seconds_bucket{job=\"workers\"}[$__rate_interval])) by (le))",
                          "legendFormat": "p95 processing time"
                        }
                      ]
                    },
                    {
                      "id": 3,
                      "title": "Errors \u2014 total vs. failed listener invocation rate",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 0,
                        "y": 8,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "ops"
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(rate(spring_kafka_listener_seconds_count{job=\"workers\"}[$__rate_interval]))",
                          "legendFormat": "total"
                        },
                        {
                          "refId": "B",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(rate(spring_kafka_listener_seconds_count{job=\"workers\", error!=\"none\"}[$__rate_interval]))",
                          "legendFormat": "errors"
                        }
                      ]
                    },
                    {
                      "id": 4,
                      "title": "Errors \u2014 failure ratio (current)",
                      "type": "stat",
                      "gridPos": {
                        "x": 12,
                        "y": 8,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "percentunit",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {
                                "color": "green",
                                "value": null
                              },
                              {
                                "color": "yellow",
                                "value": 0.01
                              },
                              {
                                "color": "red",
                                "value": 0.05
                              }
                            ]
                          }
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(rate(spring_kafka_listener_seconds_count{job=\"workers\", error!=\"none\"}[$__rate_interval])) / clamp_min(sum(rate(spring_kafka_listener_seconds_count{job=\"workers\"}[$__rate_interval])), 1e-9)",
                          "legendFormat": "failure ratio"
                        }
                      ]
                    },
                    {
                      "id": 5,
                      "title": "Saturation \u2014 JVM heap used",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 0,
                        "y": 16,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "percentunit",
                          "max": 1,
                          "min": 0
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(jvm_memory_used_bytes{job=\"workers\", area=\"heap\"}) / sum(jvm_memory_max_bytes{job=\"workers\", area=\"heap\"})",
                          "legendFormat": "heap used"
                        }
                      ]
                    },
                    {
                      "id": 6,
                      "title": "Saturation \u2014 Kafka consumer lag (work-items)",
                      "description": "Real kafka_consumer_fetch_manager_records_lag_max (observability#15, ADR 0020) \u2014 replaces the applicationTaskExecutor thread-pool-usage proxy ADR 0017 shipped with. WorkItemConsumerConfig's ConsumerFactory is hand-built (ADR 0011), so Boot's auto-configured Kafka metrics binder never saw it; KafkaClientMetrics is now bound directly against the real Consumer via ConsumerFactory.Listener#consumerAdded. Verified: this exact series was confirmed present (nonzero client_id-tagged gauge) on a live /actuator/prometheus scrape after producing and consuming a real message (WorkersMetricsHistogramTest), a real queue-depth saturation signal instead of a proxy.",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 12,
                        "y": 16,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "min": 0
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "max(kafka_consumer_fetch_manager_records_lag_max{job=\"workers\"})",
                          "legendFormat": "max records lag"
                        }
                      ]
                    }
                  ]
                }
            workers-keda-autoscaling:
              json: |
                {
                  "uid": "workers-keda-autoscaling",
                  "title": "workers — KEDA Autoscaling (backlog #63)",
                  "description": "Real replica count (from Prometheus's own already-scraped pod-role service discovery, argocd/apps/prometheus.yaml's `workers` job -- no kube-state-metrics needed, that's disabled in this cluster) alongside KEDA's own scale-decision signal (kubernetes/workers/scaledobject.yaml's kafka trigger). PromQL for the keda_scaler_* panels is built from KEDA 2.20.2's real source (pkg/metricscollector/prommetrics.go: metric namespace \"keda\", labels namespace/metric/scaledObject/scaler/triggerIndex/type) and argocd/apps/keda.yaml's own scrape config, not assumed from docs -- but NOT independently re-confirmed live against a running KEDA instance this session, since this backlog item's own PR is what first deploys KEDA to this cluster. See that PR's description for exactly what is and isn't live-verified.",
                  "tags": [
                    "golden-signals",
                    "workers",
                    "keda"
                  ],
                  "timezone": "browser",
                  "schemaVersion": 39,
                  "version": 1,
                  "editable": false,
                  "time": {
                    "from": "now-6h",
                    "to": "now"
                  },
                  "refresh": "30s",
                  "panels": [
                    {
                      "id": 1,
                      "title": "Replicas — real running/scraped workers pods",
                      "description": "count(up{job=\"workers\"} == 1) -- the actual number of workers pods Prometheus's own pod-role service discovery currently sees Up, the direct real-scale-out/scale-in proof this backlog item's AC asks for. Not KEDA's own internal desired-replica state -- an independently observed count.",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 0,
                        "y": 0,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "min": 0
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "count(up{job=\"workers\"} == 1)",
                          "legendFormat": "running replicas"
                        }
                      ]
                    },
                    {
                      "id": 2,
                      "title": "KEDA's own scaler metric value (Kafka consumer-group lag, as KEDA sees it)",
                      "description": "keda_scaler_metrics_value{scaledObject=\"workers\"} -- the kafka scaler's own lag reading, queried directly from the broker's consumer-group offsets (pkg/scalers), independent of workers' own self-reported kafka_consumer_fetch_manager_records_lag (the metric WorkersConsumerLagHigh alerts on, and the one #76 found goes dark at zero replicas). Plotted alongside that existing metric below for a direct visual reconciliation of the two signals.",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 12,
                        "y": 0,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "min": 0
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(keda_scaler_metrics_value{scaledObject=\"workers\"})",
                          "legendFormat": "KEDA-observed lag"
                        },
                        {
                          "refId": "B",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "sum(kafka_consumer_fetch_manager_records_lag{job=\"workers\"})",
                          "legendFormat": "workers' own self-reported lag"
                        }
                      ]
                    },
                    {
                      "id": 3,
                      "title": "KEDA scaler active (is KEDA currently trying to scale beyond min)",
                      "description": "keda_scaler_active{scaledObject=\"workers\"} -- 1 once totalLag exceeds activationLagThreshold (10, scaledobject.yaml), 0 otherwise.",
                      "type": "stat",
                      "gridPos": {
                        "x": 0,
                        "y": 8,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              { "color": "green", "value": null },
                              { "color": "blue", "value": 1 }
                            ]
                          }
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "max(keda_scaler_active{scaledObject=\"workers\"})",
                          "legendFormat": "scaler active"
                        }
                      ]
                    },
                    {
                      "id": 4,
                      "title": "KEDA-derived desired replica count (lag / lagThreshold, capped)",
                      "description": "ceil(KEDA-observed lag / lagThreshold=50), clamped to [minReplicaCount=1, maxReplicaCount=3] (scaledobject.yaml) -- an approximation of the kafka scaler's own internal replica math for visual comparison against panel 1's real observed count, not KEDA's own internal HPA-computed value directly (no kube-state-metrics in this cluster to read the HPA object's own .status.desiredReplicas from).",
                      "type": "timeseries",
                      "gridPos": {
                        "x": 12,
                        "y": 8,
                        "w": 12,
                        "h": 8
                      },
                      "datasource": {
                        "type": "prometheus",
                        "uid": "prometheus"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "min": 0,
                          "max": 3
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                          },
                          "expr": "clamp_max(clamp_min(ceil(sum(keda_scaler_metrics_value{scaledObject=\"workers\"}) / 50), 1), 3)",
                          "legendFormat": "approx. desired replicas"
                        }
                      ]
                    }
                  ]
                }
            watchlist-service-golden-signals:
              json: |
                {
                  "uid": "watchlist-service-golden-signals",
                  "title": "watchlist-service — Fan-out and Delivery (backlog #53)",
                  "description": "watchlist-service has no meaningful outward HTTP traffic of its own (subscription CRUD is low-volume admin traffic) — its real golden signals are the fan-out/delivery pipeline ADR 0026 introduces: how long resolving+persisting takes, how long an actual delivery takes end to end, delivery attempts by outcome, and DLQ depth. No _bucket histogram wired for these two Timers yet (only http.server.requests got percentiles-histogram enabled, ADR 0020) — these two panels plot sum/count average latency, not p95; a real follow-up, not silently presented as a percentile it isn't.",
                  "tags": [
