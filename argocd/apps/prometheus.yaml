# Prometheus for observability#2 (ADR 0014). Helm chart source with
# values inline, same pattern as Kafka/Postgres/OTel Collector. Own
# `prometheus` namespace (multiple scrape targets, no credential to
# worry about — same reasoning as Kafka/OTel Collector, not Postgres's
# single-consumer exception).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.19.0
    helm:
      valuesObject:
        # fullnameOverride keeps resource names short and predictable
        # (Service ends up "prometheus-server", the chart's own
        # component-name suffix — confirmed by rendering locally, not
        # assumed).
        fullnameOverride: prometheus
        # This chart bundles Alertmanager, kube-state-metrics,
        # node-exporter, and pushgateway as optional subcharts.
        # kube-state-metrics/node-exporter/pushgateway stay disabled for
        # the same reasons ADR 0014 gave (K8s/host-level metrics and a
        # push-based source this project doesn't have). Alertmanager
        # flips to enabled here -- ADR 0020/backlog #21: alert rules are
        # only worth shipping if something evaluates and routes them.
        alertmanager:
          enabled: true
          # No PVC (ADR 0020 v1 decision, mirrors ADR 0014's "no
          # dashboards/alerts built ahead of need" caution applied to
          # storage instead): this is Alertmanager's first deploy ever
          # in this cluster, and its on-disk state is only the
          # notification log and any active silences -- losing that on a
          # pod restart in a single-operator dev cluster with no
          # existing silence to protect is a real but small cost.
          # Revisit if a real silence gets created and losing it on a
          # restart actually causes a problem, not built ahead of that.
          persistence:
            enabled: false
          # backlog #114: found live 2026-08-07 -- this subchart shipped
          # with no resources block at all (unlike kube-state-metrics/
          # node-exporter below, which already got one at #92). Real
          # measured usage (`kubectl top pod`) is tiny (~2m CPU/14Mi
          # mem) -- sized with generous headroom anyway, same "never
          # unconstrained" convention as every other component here.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          # Alertmanager's own config (not Prometheus's rule files, see
          # server.serverFiles below) -- one real receiver, ntfy.sh
          # (backlog #21c). See prometheus.yaml's alertmanager.config
          # comment further down for why ntfy over Slack/Discord/
          # Telegram/PagerDuty/email.
          #
          # backlog #107: the ntfy topic name used to be committed here,
          # in this exact receiver, directly contradicting the comment
          # immediately below that states ntfy's own real threat model
          # ("the only protection is not being guessable") -- found live
          # 2026-08-06 reviewing a PR that read this same file. Fixed by
          # mounting the topic's full URL from a Secret this project's
          # existing out-of-band pattern provisions
          # (bootstrap/create-stateful-secrets.sh, same shape as every
          # other real credential here) and pointing Alertmanager's own
          # `url_file` config key (mutually exclusive with `url`, a real
          # upstream Alertmanager feature, not a chart-specific one) at
          # the mounted file instead of embedding the value in this
          # values block. The old topic is burned -- rotated, not
          # reused, since it had been publicly readable in git history
          # since this receiver first shipped.
          extraSecretMounts:
            - name: ntfy-webhook-url
              mountPath: /etc/alertmanager-secrets
              secretName: ntfy-webhook-url
              readOnly: true
          config:
            global: {}
            route:
              # group_by on alertname+job rather than the chart's
              # cluster-wide default: this cluster's whole alert surface
              # is 7 rules across 4 jobs (below) -- grouping tighter than
              # that would just mean every alert gets its own
              # notification anyway, so this is documentation of intent
              # more than a real behavior change yet.
              group_by: ['alertname', 'job']
              # 30s/5m/4h: low-traffic dev cluster, no on-call rotation
              # to page -- a few minutes of grouping delay costs nothing
              # real, and a 4h repeat keeps a still-firing alert from
              # re-notifying the one human who'll see it every
              # group_interval tick.
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: ntfy
              routes:
                # Basic severity routing tree (backlog #21c's AC): a
                # critical/page-equivalent route exists structurally so
                # #21b's future burn-rate/multi-window work has
                # somewhere to attach a different receiver or repeat
                # cadence later. For v1 it shares the same (only) real
                # receiver, just faster to first-notify and re-notify --
                # intentionally not building out a second receiver or
                # inhibition rules nobody needs yet.
                - matchers:
                    - severity="critical"
                  receiver: ntfy
                  group_wait: 10s
                  repeat_interval: 1h
            receivers:
              - name: ntfy
                # Generic webhook_configs, not a dedicated integration --
                # Alertmanager has no native ntfy receiver type. Verified
                # live before choosing this shape: POSTing an
                # Alertmanager-shaped JSON blob straight to
                # https://ntfy.sh/<topic> (topic already in the URL, no
                # Content-Type-triggered schema parsing at that path)
                # returns 200 and delivers a real push notification whose
                # body is that raw JSON -- readable (alertname, severity,
                # summary are all in there as plain text) but not
                # prettified. A nicer per-alert title/priority would need
                # a small templating relay in front of ntfy; out of scope
                # for a v1 that only needs one real, verified-live
                # notification path to exist (ADR 0020's stated gap this
                # closes). Topic name is a randomly-generated-once
                # string, not a guessable/shared default -- ntfy topics
                # are public-by-topic-name with no auth, so the only
                # protection is not being guessable. **The topic name
                # itself must therefore never appear in this
                # git-tracked, public file** (backlog #107, real
                # incident: it did, for as long as this receiver has
                # existed) -- `url_file` below reads it from the
                # extraSecretMounts volume above instead.
                webhook_configs:
                  - url_file: /etc/alertmanager-secrets/url
                    send_resolved: true
        # backlog #92 (ADR 0031/M15, 2026-08-07): enabled -- the ADR
        # 0014-era reasoning for leaving both off ("no K8s/host-level
        # metrics needed yet") expired the day KEDA started making
        # real scheduling decisions (backlog #63) and the day
        # local-path's unenforced PVC quotas made the node disk the
        # single most likely real outage (backlog #21d, unblocked by
        # this change). Both subcharts ship `resources: {}` by default
        # (confirmed against the real pinned chart versions'
        # values.yaml, not assumed) -- explicit requests/limits set
        # below, matching this project's own convention of never
        # leaving a component unconstrained, sized as a first-deploy
        # starting point (no real usage history for either yet, same
        # "revisit with #77-style follow-up sampling" precedent every
        # other first deploy here uses) against real, well-known
        # footprints for these two specific, extremely thin components
        # (a Go binary reading /proc and /sys for node-exporter; a
        # single controller pod listing a handful of K8s objects for
        # kube-state-metrics on a cluster this small). Real headroom
        # checked live immediately before this change (see this
        # backlog item's own PR description) -- both additions
        # together are two orders of magnitude below what's actually
        # free.
        kube-state-metrics:
          enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          # Real mistake caught by CI, not shipped: this chart's own
          # Service template (templates/service.yaml) already emits
          # `prometheus.io/scrape` unconditionally from a separate
          # top-level `prometheusScrape` value (real default `true`,
          # confirmed against the chart's own values.yaml) -- an
          # explicit `service.annotations.prometheus.io/scrape: "true"`
          # here duplicates that same key in the rendered map, which
          # `helm-render`'s kubeconform check correctly rejected
          # ("key ... already set in map") before this ever reached the
          # live cluster. No override needed: the annotation is already
          # on by default, unlike node-exporter's own Service, which
          # gets the same annotation through its own, differently-named
          # default (`prometheus.io/scrape: "true"` baked directly into
          # its service.annotations default, confirmed separately).
        prometheus-node-exporter:
          enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        prometheus-pushgateway:
          enabled: false
        # Two scrape mechanisms, deliberately (ADR 0014): api has a
        # stable Service DNS, so a static target. workers has no
        # Kubernetes Service at all (ADR 0009/0011, deliberate) --
        # scraped via Kubernetes pod-role service discovery instead,
        # the same direct-to-pod mechanism kubelet's own probes use.
        # No relabeling needed: the workers namespace holds only
        # workers pods, and its Deployment already declares
        # containerPort: 8080, so pod-role SD sets __address__
        # correctly on its own. otel-collector's own self-monitoring
        # metrics (:8888, ADR 0013) get a fourth static target --
        # monitoring the telemetry pipeline itself, not scope creep.
        #
        # clinvar-service (job clinvar-service) is a fifth static target,
        # added here as part of #21: it shipped its own /metrics endpoint
        # under #21a/observability#15 (ADR 0019/0020) but was never
        # actually added to Prometheus's scrape config in the same PR --
        # confirmed live against a real running Prometheus
        # (/api/v1/targets showed no clinvar-service entry at all) before
        # writing any alert rule against clinvar_* metrics, since an
        # unscraped metric's alert rule would just silently never fire
        # rather than error, the worse kind of gap. Same stable Service
        # DNS shape as api (clinvar-service.clinvar.svc.cluster.local,
        # ADR 0019's own namespace), so static config, not discovery.
        # `gateway`'s own static target was removed by ADR 0021/backlog
        # #S1 along with the service itself.
        extraScrapeConfigs: |
          - job_name: api
            metrics_path: /actuator/prometheus
            static_configs:
              - targets: ['api.api.svc.cluster.local:80']
          - job_name: otel-collector
            static_configs:
              - targets: ['otel-collector.otel.svc.cluster.local:8888']
          - job_name: workers
            metrics_path: /actuator/prometheus
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: ['workers']
          - job_name: clinvar-service
            metrics_path: /metrics
            static_configs:
              - targets: ['clinvar-service.clinvar.svc.cluster.local:80']
          # watchlist-service (backlog #53): a sixth static target, same
          # stable-Service-DNS reasoning as api/clinvar-service above
          # (watchlist-service.watchlist.svc.cluster.local, its own
          # namespace per platform/argocd/apps/watchlist-service.yaml).
          - job_name: watchlist-service
            metrics_path: /actuator/prometheus
            static_configs:
              - targets: ['watchlist-service.watchlist.svc.cluster.local:80']
          # news-ingestor (backlog #79, M13): same "no stable Service DNS"
          # shape as workers above -- kubernetes/news-ingestor/deployment.yaml
          # deliberately has no Kubernetes Service (ADR 0009/0011, this
          # service has no business HTTP API), so pod-role discovery
          # scoped to its own namespace, not a static target. Not yet a
          # real scrape target as of this PR -- news-ingestor's
          # Application (argocd/apps/news-ingestor.yaml) is deliberately
          # not auto-synced yet (M13's incremental-rollout discipline);
          # this job finds nothing (no pods in the namespace) until a
          # human actually syncs it, the same inert-until-target-exists
          # shape any config added ahead of its target has, not a broken
          # target -- checked live (`kubectl get pods -n news-ingestor`
          # returns nothing today), not assumed.
          - job_name: news-ingestor
            metrics_path: /actuator/prometheus
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: ['news-ingestor']
          # traefik (backlog #56): a seventh target, for the
          # api-key-auth/api-key-ratelimit Traefik middleware's own
          # rejections (401/429) -- these never reach api's backend, so
          # they only ever show up in Traefik's own metrics, not api's
          # http_server_requests_seconds_count. Pod-role discovery, not a
          # static target: the "traefik" Service (argocd/apps/traefik.yaml)
          # only exposes web/websecure (80/443), no metrics port -- same
          # "no stable Service DNS for this port" reasoning already used
          # for workers above, applied to a different chart's own port
          # layout. metrics.prometheus is already enabled by this chart's
          # own defaults (confirmed live: the running pod's args already
          # include --metrics.prometheus=true and
          # --entryPoints.metrics.address=:9100/tcp with no explicit
          # values.yaml change needed) -- the pod exposes 4 named
          # container ports (metrics/traefik/web/websecure); the
          # relabel_configs below keep only the "metrics" one so this job
          # doesn't also try (and fail) to scrape /metrics off the
          # web/websecure/dashboard ports.
          - job_name: traefik
            metrics_path: /metrics
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: ['traefik']
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                regex: metrics
                action: keep
          # KEDA (backlog #63): scaling-decision visibility for the new
          # `workers` ScaledObject (kubernetes/workers/scaledobject.yaml).
          # Same shape as Traefik above -- no stable Service DNS for the
          # metrics port specifically (keda-operator's own Service fronts
          # its gRPC metrics-service port 9666, not 8080), so pod-role
          # discovery filtered to the "metrics" container port name,
          # which argocd/apps/keda.yaml's prometheus.operator.enabled:
          # true adds to the operator pod (confirmed against the real
          # chart's templates/manager/deployment.yaml before writing
          # this, not assumed). Picks up both keda-operator and
          # keda-operator-metrics-apiserver pods -- the metrics-apiserver
          # process exposes the same-named port unconditionally (chart's
          # own metrics-server/deployment.yaml), independent of the
          # prometheus.metricServer.enabled toggle this project leaves
          # off. keda_scaler_metrics_value/keda_scaler_active (the real
          # scale-decision signal) are recorded from
          # pkg/scaling/scale_handler.go, which only the operator process
          # runs -- confirmed against KEDA 2.20.2's real source before
          # relying on it, not assumed from the metric name alone.
          - job_name: keda
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: ['keda']
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                regex: metrics
                action: keep
          # market-data-ingestor (backlog #78, ADR 0029/M13): pod-role
          # discovery, not a static target -- same reasoning as workers
          # above (ADR 0009/0011: no business HTTP API, so no stable
          # Kubernetes Service exists to point a static target at).
          - job_name: market-data-ingestor
            metrics_path: /actuator/prometheus
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: ['market-data-ingestor']
          # sentiment-analyzer (backlog #80, ADR 0029/M13): pod-role
          # discovery, not a static target -- same "no business HTTP API,
          # so no stable Kubernetes Service" reasoning as news-ingestor/
          # market-data-ingestor above (ADR 0009/0011). metrics_path is
          # /metrics, not /actuator/prometheus -- this is a Python/
          # FastAPI service (clinvar-service's own scrape-endpoint shape,
          # ADR 0019), no Spring Actuator here. Not yet a real scrape
          # target as of this PR -- sentiment-analyzer's Application
          # (argocd/apps/sentiment-analyzer.yaml) is deliberately not
          # auto-synced yet (M13's incremental-rollout discipline); this
          # job finds nothing until a human actually syncs it, the same
          # inert-until-target-exists shape news-ingestor's own entry had
          # before its first sync.
          - job_name: sentiment-analyzer
            metrics_path: /metrics
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: ['sentiment-analyzer']
          # aggregator (backlog #81, ADR 0029/M13): a seventh static
          # target, same stable-Service-DNS reasoning as
          # api/clinvar-service/watchlist-service above -- aggregator
          # has a real Kubernetes Service (kubernetes/aggregator/
          # service.yaml, unlike news-ingestor/market-data-ingestor/
          # sentiment-analyzer, which have none per ADR 0009/0011).
          # Found live during backlog #90 (ADR 0031/M15): aggregator
          # was never actually added here in #81's/#56's own PRs --
          # confirmed against a real running Prometheus
          # (`up{job="aggregator"}` returned zero series, same
          # never-scraped-at-all shape #21 already found and fixed once
          # for clinvar-service, above) before writing any dashboard
          # panel or alert rule against aggregator_*/kafka_streams_*
          # metrics, since an unscraped metric's query would just
          # silently return no data rather than error.
          - job_name: aggregator
            metrics_path: /actuator/prometheus
            static_configs:
              - targets: ['aggregator.aggregator.svc.cluster.local:80']
          # Blackbox synthetic monitoring (backlog #93, ADR 0031/M15) --
          # the standard Prometheus-side half of the blackbox_exporter
          # pattern: Prometheus itself scrapes blackbox-exporter's own
          # /probe endpoint, passing the real target URL as a query
          # param via relabel_configs; blackbox-exporter (not
          # Prometheus) makes the actual outbound HTTP request through
          # the real Ingress/TLS chain (argocd/apps/blackbox-exporter.yaml's
          # own comment has the real hostAliases/CA-trust reasoning).
          # Three jobs, one per module, since each module probes a
          # different real contract -- not folded into one job with a
          # mixed target list, which would make the per-job `up`/
          # `probe_success` series ambiguous about which check actually
          # failed.
          - job_name: blackbox-http-2xx
            metrics_path: /probe
            params:
              module: [http_2xx]
            static_configs:
              - targets:
                  - https://aggregator.local.adamastorx.test/aggregates
                  - https://grafana.local.adamastorx.test/
                  - https://visualizer.local.adamastorx.test/
                  - https://clinvar-viewer.local.adamastorx.test/
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
          # api's real auth contract, half 1: a real "blackbox" tenant
          # key must produce a real 2xx on a real, side-effect-free GET.
          - job_name: blackbox-http-2xx-auth
            metrics_path: /probe
            params:
              module: [http_2xx_auth]
            static_configs:
              - targets:
                  - https://api.local.adamastorx.test/work-items
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
          # api's real auth contract, half 2: the identical path, no
          # credential, must be rejected with a real 401 -- both halves
          # together are the actual, real proof the auth chain works,
          # not just "api responds to something."
          - job_name: blackbox-http-401-expected
            metrics_path: /probe
            params:
              module: [http_401_expected]
            static_configs:
              - targets:
                  - https://api.local.adamastorx.test/work-items
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
        server:
          # backlog #114: found live 2026-08-07 -- no resources block on
          # the actual metrics-store/query pod, the largest real consumer
          # of any component checked in that finding (measured 508-667Mi
          # real memory, fluctuating with query load, against 0 declared
          # requests -- the single biggest contributor to the node's
          # real-vs-reported memory gap). Sized above the observed peak
          # with real headroom for query bursts, not the peak itself.
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # backlog #94 (ADR 0014 addendum, 2026-08-07): raised 3d -> 30d.
          # 3-day retention silently capped every reliability-over-time
          # claim this project could make -- no 28-day error budget, no
          # SLO-over-time report. Real measured cost, not assumed: a real
          # `kubectl exec ... du -sh /data` against the live pod showed
          # 1.1G accumulated over the existing 3-day window (~370Mi/day),
          # against 162.6G free on the node at measurement time -- 30d
          # costs ~11Gi, a small fraction of real headroom.
          retention: "30d"
          persistentVolume:
            # Raised 2Gi -> 16Gi alongside retention, headroom above the
            # measured 30-day figure (~11Gi), not a bare minimum. Real
            # PVC, not emptyDir (ADR 0014, same reasoning as Postgres,
            # ADR 0012): this data has actual continuity value -- that's
            # what a retention policy means.
            size: 16Gi
          # Fixed local address (no more port-forward for day-to-day
          # access) -- same adamastorx-ca/Traefik pattern api's own
          # Ingress uses (ADR 0021). Local-only for now (ADR 0004, no
          # public DNS yet): add a /etc/hosts entry for
          # prometheus.local.adamastorx.test pointing at the node's IP.
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: adamastorx-ca
            hosts:
              - prometheus.local.adamastorx.test
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.local.adamastorx.test
        # One alert rule per SLO in ADR 0020's table (backlog #21).
        # serverFiles.alerting_rules.yml, not a PrometheusRule CRD --
        # same anti-Operator reasoning ADR 0014 already used to reject
        # kube-prometheus-stack (no CRD surface for a single static
        # Prometheus instance), applied to alerting the same way it was
        # applied to scrape config. Every threshold below is a
        # deliberately simple v1 pick for this project's actual traffic
        # (a handful of manual/test requests per session, not
        # production load) -- documented inline per rule, not derived
        # from a real historical distribution this cluster doesn't have
        # yet (ADR 0020 explicitly defers exact error-budget math to
        # "once the histogram/lag metrics are live", not decided here in
        # the abstract).
        #
        # What each alert means, one line, so it's not firing into a
        # void before backlog #22 (dedicated runbooks item) writes the
        # real first-response doc per alert:
        #   ApiHighErrorRate: the service itself is returning 5xx to a
        #     real share of its callers -- look at its own logs/traces
        #     first, not a downstream dependency.
        #   ApiVariantsLookupHighErrorRate: api's calls to
        #     clinvar-service are failing -- check clinvar-service's own
        #     health/logs before assuming the bug is in api.
        #   WorkersListenerErrorRate: work-items messages are failing
        #     processing (the `error` tag names the exception) --
        #     check for a poison message or a downstream dependency
        #     (Postgres) outage.
        #   WorkersConsumerLagHigh: workers is falling behind
        #     work-items' production rate -- check if the pod is even
        #     running/consuming at all before assuming it's just slow.
        #     Backlog #63: KEDA's ScaledObject
        #     (kubernetes/workers/scaledobject.yaml) now reacts to the
        #     same underlying lag first, at a much lower threshold (50
        #     vs. this rule's 500) by adding consumers -- this rule
        #     firing means KEDA's own reaction did not resolve it in
        #     time (every partition already has a consumer and lag is
        #     still climbing, a downstream dependency is stuck, or this
        #     node's real CPU pressure kept an extra replica from ever
        #     reaching Ready). Not a duplicate signal: KEDA is the
        #     automatic first responder, this alert is the human-paging
        #     backstop for when that response wasn't enough -- the two
        #     thresholds are deliberately far apart so the common case
        #     (KEDA fixes it) never reaches this rule's 10m window.
        #   WorkersConsumerMissing: workers isn't reporting a consumer-lag
        #     metric at all (backlog #76) -- this is the "the pod is even
        #     running" check the rule above tells you to do by hand, now
        #     automatic. Real finding (chaos scenario 3,
        #     observability/chaos/03-consumer-lag.md): the lag metric is
        #     self-reported by workers' own JVM, so it goes completely
        #     dark -- not a high number, no series at all -- exactly when
        #     the consumer is fully stopped, which is the one case
        #     WorkersConsumerLagHigh structurally cannot catch. Backlog
        #     #63: this is also exactly why KEDA's ScaledObject
        #     (kubernetes/workers/scaledobject.yaml) deliberately does
        #     NOT use scale-to-zero -- minReplicaCount stays 1, with the
        #     reason stated in that file -- zero replicas would make this
        #     rule fire on every ordinary idle-drain, not only a real
        #     stuck-consumer incident, and there is no already-available
        #     signal in this cluster (kube-state-metrics is disabled) to
        #     tell the two apart yet.
        #   ClinVarIngestionFreshnessBreach: no ClinVar ingestion job has
        #     reached status=succeeded in over a week (backlog #54: real
        #     job outcomes, not "an attempt happened") -- check the most
        #     recent job's failure_reason via GET
        #     /internal/clinvar/ingest/{job_id} or clinvar_ingestion_job
        #     directly, and clinvar-service's logs/APScheduler state.
        #   ClinVarIngestionDurationAnomaly: the last ingestion run took
        #     several times longer than the ~90s real-data baseline --
        #     the exact shape the double-ingestion incident had before
        #     it became observable; check for a concurrent/overlapping
        #     run or an unusually large source VCF.
        #   WatchlistDlqDepthHigh (backlog #53): a subscriber's ntfy
        #     target has permanently failed -- check that subscription's
        #     ntfy_topic is reachable/correct; other subscribers' fan-out
        #     is unaffected by design (ADR 0026), so this is never an
        #     "everything is down" page.
        #   ApiRateLimitRejectionsHigh (backlog #56): the api-key-ratelimit
        #     Traefik middleware is sustained-rejecting a real share of
        #     requests with 429 -- check whether a specific tenant's key
        #     is legitimately over its 5 req/s budget (kubernetes/api/
        #     middlewares.yaml) or something is retrying too aggressively;
        #     this fires on the shared `websecure` entrypoint (every
        #     public Ingress host), not api specifically, since Traefik's
        #     own metrics don't carry a per-router/per-tenant label here
        #     (stated gap, see docs/adr/0027 in the adamastorx repo) --
        #     today api is the only route with rate limiting, so in
        #     practice it is api-specific, but that stops being true the
        #     moment a second Ingress gets its own rate limit.
        serverFiles:
          alerting_rules.yml:
            groups:
              - name: adamastorx-slos
                rules:
                  # `gateway`'s GatewayHighErrorRate rule (and its scrape
                  # target) was removed by ADR 0021/backlog #S1 along with
                  # the service itself -- api's own Ingress is now the
                  # live Traefik+TLS+service path.
                  #
                  # api (ADR 0020: non-5xx rate, excluding /actuator/*
                  # same as ADR 0017's dashboard so its own health/scrape
                  # traffic never counts against it). outcome="SERVER_ERROR"
                  # is Micrometer's own tag (confirmed live, not assumed --
                  # same query shape ADR 0017's dashboard already uses).
                  # 5% breach threshold: matches the dashboard's own
                  # existing "critical" threshold (ADR 0017), so this
                  # isn't a new number invented for this rule. `for: 5m`
                  # and a >0 traffic guard: a dev cluster's total request
                  # rate is low enough that a single failed manual test
                  # request could otherwise swing the ratio to 100% for
                  # one scrape -- sustained over 5m with real traffic
                  # underneath filters that out.
                  - alert: ApiHighErrorRate
                    expr: >-
                      (
                        sum(rate(http_server_requests_seconds_count{job="api", outcome="SERVER_ERROR", uri!~"/actuator.*"}[5m]))
                        /
                        sum(rate(http_server_requests_seconds_count{job="api", uri!~"/actuator.*"}[5m]))
                      ) > 0.05
                      and sum(rate(http_server_requests_seconds_count{job="api", uri!~"/actuator.*"}[5m])) > 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "api non-5xx rate breached (>5% over 5m)"
                      description: "api is returning 5xx to more than 5% of requests over the last 5m. See ADR 0020's SLO table."

                  # api's GET /variants/lookup specifically (ADR 0020:
                  # "its own external-dependency failure mode" -- this
                  # path calls out to clinvar-service, a distinct
                  # failure mode from the rest of api). 10%, not 5%: this
                  # single endpoint sees far less traffic than api as a
                  # whole in this dev cluster, so its ratio is noisier
                  # per request -- a slightly higher bar avoids paging on
                  # one or two failed manual test calls while still
                  # catching a real clinvar-service outage (which would
                  # push this well past 10%, not hover near it).
                  - alert: ApiVariantsLookupHighErrorRate
                    expr: >-
                      (
                        sum(rate(http_server_requests_seconds_count{job="api", outcome="SERVER_ERROR", uri="/variants/lookup"}[5m]))
                        /
                        sum(rate(http_server_requests_seconds_count{job="api", uri="/variants/lookup"}[5m]))
                      ) > 0.10
                      and sum(rate(http_server_requests_seconds_count{job="api", uri="/variants/lookup"}[5m])) > 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "api's GET /variants/lookup non-5xx rate breached (>10% over 5m)"
                      description: "api's calls through GET /variants/lookup (its clinvar-service dependency) are failing more than 10% of the time over 5m. See ADR 0020's SLO table."

                  # workers (ADR 0020: listener timer's own `error` label,
                  # != "none", not latency). Same 5%/5m reasoning as
                  # api's non-5xx rate above -- this is workers' direct
                  # equivalent signal, just on a different metric family
                  # since it has no business HTTP API (ADR 0009/0011).
                  - alert: WorkersListenerErrorRate
                    expr: >-
                      (
                        sum(rate(spring_kafka_listener_seconds_count{job="workers", error!="none"}[5m]))
                        /
                        sum(rate(spring_kafka_listener_seconds_count{job="workers"}[5m]))
                      ) > 0.05
                      and sum(rate(spring_kafka_listener_seconds_count{job="workers"}[5m])) > 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "workers listener error rate breached (>5% over 5m)"
                      description: "workers' work-items listener is failing more than 5% of processed messages over 5m (the `error` tag names the exception). See ADR 0020's SLO table."

                  # workers consumer-lag threshold (ADR 0020: saturation
                  # signal is backlog depth, not latency -- the real
                  # metric #21a added, KafkaClientMetrics bound directly
                  # against the hand-built ConsumerFactory). Summed
                  # across work-items' 3 partitions (ADR 0011) for total
                  # backlog, not just the worst single partition.
                  # Threshold of 500: this dev cluster's real traffic is
                  # a handful of messages per session, so a genuine
                  # sustained backlog of 500+ un-consumed records is
                  # already multiple orders of magnitude past normal
                  # jitter -- picked as "obviously abnormal for this
                  # cluster's actual load", not tuned against a real
                  # historical distribution (ADR 0020 defers that).
                  # `for: 10m`, longer than the HTTP/listener error
                  # rules above: lag can spike transiently on a burst of
                  # produced messages before workers catches up, and 10m
                  # of sustained backlog is what separates "catching up"
                  # from "stuck".
                  - alert: WorkersConsumerLagHigh
                    expr: sum(kafka_consumer_fetch_manager_records_lag{job="workers"}) > 500
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "workers consumer lag sustained above 500 records"
                      description: "workers' work-items consumer group backlog has stayed above 500 un-consumed records for 10m. See ADR 0020's SLO table."

                  # backlog #76: companion to WorkersConsumerLagHigh above,
                  # not a replacement -- that rule alerts on a real,
                  # reported lag *value*; this one alerts on the metric's
                  # own *absence*, confirmed live (chaos scenario 3,
                  # observability/chaos/03-consumer-lag.md) to be exactly
                  # what happens when workers has zero replicas: no
                  # Prometheus scrape target at all (pod-role service
                  # discovery has nothing to discover), so
                  # kafka_consumer_fetch_manager_records_lag isn't a large
                  # number, it's an empty result set. absent(...) is the
                  # correct primitive for that -- it evaluates to 1 when
                  # zero series match the selector, not when a matching
                  # series happens to read 0. `for: 3m`: long enough to
                  # not fire on a normal rolling deploy's brief gap between
                  # the old pod terminating and the new one passing
                  # readiness (worst case ~80s per the deployment's own
                  # probe budget, platform#35), short enough to catch a
                  # genuinely stuck-down consumer in minutes, not the
                  # 95-minute silent stall #35's own incident had.
                  - alert: WorkersConsumerMissing
                    expr: absent(kafka_consumer_fetch_manager_records_lag{job="workers"})
                    for: 3m
                    labels:
                      severity: critical
                    annotations:
                      summary: "workers consumer-lag metric missing -- consumer likely not running"
                      description: "workers has reported no kafka_consumer_fetch_manager_records_lag series for 3m -- almost certainly means the pod isn't running/scraped at all, not that lag is low. Check `kubectl get pods -n workers` directly. See backlog #76 / observability/chaos/03-consumer-lag.md."

                  # clinvar-service ingestion freshness (ADR 0020: time
                  # since last *successful* ingestion exceeding the
                  # scheduled weekly cadence). Re-pointed by backlog #54
                  # at clinvar_ingestion_jobs_total{status="succeeded"} --
                  # a real job outcome from clinvar-service's new async
                  # job control plane (its clinvar_ingestion_job table),
                  # closing the gap this rule previously stated as a
                  # known limitation:
                  # clinvar_ingestion_duration_seconds_count's Histogram
                  # .time() wrapper increments on both the success AND
                  # failure paths, so the old expression could only ever
                  # detect "no ingestion attempt at all in 8 days", never
                  # "attempts happened but every one failed" -- exactly
                  # backlog #21e's stated ingestion-side gap. The new
                  # expression answers the ADR 0020 wording literally:
                  # time since last *successful* ingestion. 8 days, not
                  # 7: the weekly cadence plus a one-day grace period
                  # before treating a late run as a real breach rather
                  # than ordinary scheduling jitter.
                  - alert: ClinVarIngestionFreshnessBreach
                    expr: increase(clinvar_ingestion_jobs_total{job="clinvar-service", status="succeeded"}[8d]) < 1
                    for: 0m
                    labels:
                      severity: critical
                    annotations:
                      summary: "no successful ClinVar ingestion in over 8 days"
                      description: "clinvar-service has not recorded a job reaching status=succeeded in over 8 days -- either the weekly scheduled trigger is silently dead, or every recent attempt failed. Check GET /internal/clinvar/ingest/{job_id} (backlog #54) or clinvar_ingestion_job directly for the failure_reason of the most recent job. See ADR 0020's SLO table and the double-ingestion incident this whole metric surface was built for."

                  # clinvar-service ingestion-duration anomaly (ADR 0020:
                  # a run taking several multiples of the ~90s real-data
                  # baseline -- the exact signal that would have made the
                  # double-ingestion incident visible as a metric instead
                  # of a kubectl logs --previous read after the fact).
                  # rate(_sum)/rate(_count) over 1h as "latest observed
                  # duration": ingestion runs weekly, so any 1h window
                  # containing a run's completion effectively isolates
                  # that one run's duration -- no real p95 needed for an
                  # event this infrequent. 4x baseline (360s): "several
                  # multiples" per the ADR's own wording, not a tuned
                  # number -- revisit once a real distribution of run
                  # durations exists.
                  - alert: ClinVarIngestionDurationAnomaly
                    expr: >-
                      (
                        rate(clinvar_ingestion_duration_seconds_sum{job="clinvar-service"}[1h])
                        /
                        rate(clinvar_ingestion_duration_seconds_count{job="clinvar-service"}[1h])
                      ) > 360
                      and rate(clinvar_ingestion_duration_seconds_count{job="clinvar-service"}[1h]) > 0
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: "ClinVar ingestion ran several times longer than its ~90s baseline"
                      description: "The most recent ClinVar ingestion run's observed duration is over 360s (4x the ~90s real-data baseline). See ADR 0020's SLO table."

                  # watchlist-service DLQ depth (backlog #53's own AC: "a
                  # metric and an alert" on subscriber dead-lettering).
                  # watchlist_delivery_dlq_depth is a real-time gauge
                  # (WatchlistMetrics), not a counter, so a plain threshold
                  # is the right shape -- no rate()/increase() needed. > 0
                  # for 5m: a single dead-lettered subscriber is itself
                  # worth a human look (this cluster's subscriber count is
                  # small enough that even one stuck delivery is a real
                  # signal, not noise), but 5m avoids paging on the exact
                  # instant a row crosses max-attempts before anyone's had
                  # a chance to see it self-resolve on a borderline case.
                  - alert: WatchlistDlqDepthHigh
                    expr: watchlist_delivery_dlq_depth{job="watchlist-service"} > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "watchlist-service has dead-lettered subscriber notifications"
                      description: "watchlist_delivery_dlq_depth has been above 0 for 5m -- at least one subscriber's ntfy target has permanently failed delivery after app.delivery.max-attempts retries. See ADR 0020's SLO table and ADR 0026 (outbox-table-plus-relay)."
                  # backlog #56. Real threshold, not invented: >0.2 req/s
                  # sustained is roughly one rejection every 5s, well
                  # above what either real caller's normal, correctly-
                  # keyed traffic should ever produce against a 5 req/s
                  # budget (middlewares.yaml) -- a live 20-30 request
                  # burst during this item's own development produced a
                  # real, momentary spike far above this before settling
                  # back to 0, confirming the threshold doesn't fire on
                  # ordinary single-digit-request bursts. `or vector(0)`:
                  # same real bug this project already hit once on
                  # api's own AnalysisTemplate (platform#65) -- an empty
                  # vector before this cluster's first-ever 429 would
                  # otherwise make the expression itself fail to
                  # evaluate, not just read as "no alert".
                  # market-data-ingestor stale feed (backlog #78's own AC:
                  # "a real, observable metric ... not a silent gap").
                  # market_data_stale_feed is a real-time 0/1 gauge
                  # (StaleFeedMetrics) that already bakes the US-market-hours
                  # check into its own value application-side (same shape
                  # WatchlistDlqDepthHigh above uses for
                  # watchlist_delivery_dlq_depth) -- so, unlike a raw
                  # PromQL-derived staleness expression, this rule needs no
                  # timezone-aware logic of its own: after-hours/weekend
                  # silence already reads 0, never firing this alert. `for:
                  # 5m` on top of the gauge's own 5-minute stale-threshold
                  # (app.market-data.stale-threshold,
                  # market-data-ingestor/application.yml) is a small buffer
                  # against a single borderline scrape, same reasoning as
                  # WatchlistDlqDepthHigh's own 5m.
                  - alert: MarketDataStaleFeed
                    expr: market_data_stale_feed{job="market-data-ingestor"} > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "market-data-ingestor has a stale watchlist ticker feed during US market hours"
                      description: "market_data_stale_feed is 1 for at least one watchlisted ticker -- no trade tick received within the configured staleness threshold while US markets are open (a simple America/New_York business-hours check, no holiday calendar -- see backlog #78 / market-data-ingestor's own MarketHoursService). Check the Finnhub websocket connection (market_data_websocket_reconnects_total/market_data_websocket_connect_failures_total) and market-data-ingestor's logs for a stuck or repeatedly-failing reconnect."
                  - alert: ApiRateLimitRejectionsHigh
                    expr: (sum(rate(traefik_entrypoint_requests_total{code="429",entrypoint="websecure"}[5m])) or vector(0)) > 0.2
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Traefik is sustained-rejecting requests with 429 (rate limit)"
                      description: "traefik_entrypoint_requests_total{code=\"429\"} on the websecure entrypoint has averaged over 0.2/s for 5m. See kubernetes/api/middlewares.yaml's api-key-ratelimit for the per-tenant budget and docs/adr/0027 (adamastorx repo) for why this is entrypoint-wide rather than per-tenant today."

                  # aggregator consumer lag (backlog #90, ADR 0031/M15) --
                  # same WorkersConsumerLagHigh/WorkersConsumerMissing
                  # pattern, scoped to aggregator's two real *input*
                  # topics (stock.price.tick, news.sentiment.scored), not
                  # the internal state-store changelog/restore-consumer
                  # topics (aggregator-*-store-changelog) -- those spike
                  # by design on every restart (StateStoreRecoveryTest's
                  # own real ~45s window, aggregator/README.md) and are
                  # already the state-restore-duration metric's job, not
                  # this alert's.
                  #
                  # Real, live finding before this rule was written
                  # (checked against a real running Prometheus, not
                  # assumed from the metric name): Kafka's client metrics
                  # reporter emits the SAME real lag twice per topic here
                  # -- once tagged with the real dotted topic name
                  # (topic="stock.price.tick") and once with a mangled
                  # underscore variant (topic="stock_price_tick", dots
                  # replaced) for reasons not further investigated. A
                  # naive sum(...) over this metric would silently double
                  # every real lag value. The `\.` (escaped literal dot,
                  # not "any character") in this regex matches only the
                  # real dotted topic names -- verified live that this
                  # excludes the underscore duplicates before shipping,
                  # not assumed from the regex alone.
                  #
                  # Threshold 20, not 500 (workers' own number): this
                  # pipeline's real per-15-minute-window volume is a
                  # handful to a few dozen ticks/scores per ticker
                  # (backlog #87's own live-verified numbers), two
                  # orders of magnitude below work-items' traffic --
                  # "obviously abnormal for this cluster's real load",
                  # the same non-historical reasoning WorkersConsumerLagHigh
                  # states for its own number, just recalibrated to this
                  # pipeline's actual scale.
                  - alert: AggregatorConsumerLagHigh
                    expr: sum(kafka_consumer_fetch_manager_records_lag{job="aggregator", topic=~"stock\\.price\\.tick|news\\.sentiment\\.scored"}) > 20
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "aggregator consumer lag sustained above 20 records on its real input topics"
                      description: "aggregator's stock.price.tick/news.sentiment.scored consumer backlog has stayed above 20 un-consumed records for 10m. Check `kubectl get pods -n aggregator` and recent logs for a stuck Kafka Streams thread (State.ERROR, see backlog #85(b)'s KafkaStreamsLivenessHealthIndicator, which should have already restarted a genuinely dead thread before this fires)."

                  - alert: AggregatorConsumerMissing
                    expr: absent(kafka_consumer_fetch_manager_records_lag{job="aggregator", topic=~"stock\\.price\\.tick|news\\.sentiment\\.scored"})
                    for: 3m
                    labels:
                      severity: critical
                    annotations:
                      summary: "aggregator consumer-lag metric missing on its real input topics -- consumer likely not running"
                      description: "aggregator has reported no kafka_consumer_fetch_manager_records_lag series for stock.price.tick/news.sentiment.scored in 3m -- almost certainly the pod isn't running/scraped, not that lag is low. Check `kubectl get pods -n aggregator` directly. Same shape as backlog #76 / observability/chaos/03-consumer-lag.md, applied to aggregator's own consumer."

                  # sentiment-analyzer consumer lag (backlog #90). Unlike
                  # the Java services above, confluent-kafka's Python
                  # client has no built-in Prometheus lag export --
                  # sentiment_analyzer_consumer_lag (services PR, backlog
                  # #90) is a real Gauge fed from librdkafka's own
                  # statistics.interval.ms/stats_cb, not derived here.
                  # Same 20-record threshold reasoning as
                  # AggregatorConsumerLagHigh above -- this consumer's
                  # real traffic (news.article.published) is comparably
                  # small.
                  - alert: SentimentAnalyzerConsumerLagHigh
                    expr: sum(sentiment_analyzer_consumer_lag{job="sentiment-analyzer"}) > 20
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "sentiment-analyzer consumer lag sustained above 20 records"
                      description: "sentiment-analyzer's news.article.published consumer backlog has stayed above 20 un-consumed records for 10m. Check `kubectl get pods -n sentiment-analyzer` and logs for a dead consumer thread (see SentimentConsumerWorker.is_alive()'s own docstring for the failure mode this is meant to catch)."

                  - alert: SentimentAnalyzerConsumerMissing
                    expr: absent(sentiment_analyzer_consumer_lag{job="sentiment-analyzer"})
                    for: 3m
                    labels:
                      severity: critical
                    annotations:
                      summary: "sentiment-analyzer consumer-lag metric missing -- consumer likely not running"
                      description: "sentiment-analyzer has reported no sentiment_analyzer_consumer_lag series for 3m -- almost certainly the pod isn't running/scraped, or the consumer thread died (SentimentConsumerWorker.is_alive() should have already made /healthz unhealthy before this fires). Check `kubectl get pods -n sentiment-analyzer` directly. Same shape as backlog #76 / observability/chaos/03-consumer-lag.md."

                  # Node disk capacity (backlog #21d, unblocked by #92 --
                  # node_filesystem_avail_bytes did not exist as a
                  # scraped metric until kube-state-metrics/node-exporter
                  # were enabled this same day). Every PVC on this
                  # cluster (both Postgres instances, Loki, Tempo,
                  # clinvar-service's refdata, Prometheus's own,
                  # Kafka's new one per ADR 0032) uses the `local-path`
                  # StorageClass, confirmed to enforce no storage quota
                  # -- a PVC's requests.storage is advisory only, so
                  # unbounded growth on any one of them silently eats
                  # this single node's real, shared disk with no
                  # per-service warning. `mountpoint="/"` scopes this to
                  # the real root filesystem (confirmed live: this is
                  # where /dev/sda2, the node's actual usable capacity,
                  # 250GB, mounts -- not /boot/efi or any tmpfs pseudo-
                  # filesystem also reported by node-exporter). Two
                  # tiers, real lead time before actual failure: warning
                  # at 20% free (real headroom today is ~70% free, so
                  # crossing 20% means real, sustained, abnormal growth,
                  # not routine log rotation jitter), critical at 10%
                  # free (a full node disk breaks k3s/etcd itself, not
                  # just this project's own services -- worth a faster
                  # page). `for: 15m`: this cluster's real provisioned
                  # PVC capacity is small (tens of GB total across every
                  # component), so a genuine runaway needs real,
                  # sustained growth to cross either threshold -- not a
                  # one-off write burst.
                  - alert: NodeDiskSpaceLow
                    expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.20
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Node root filesystem below 20% free"
                      description: "node_filesystem_avail_bytes{mountpoint=\"/\"} has stayed below 20% of node_filesystem_size_bytes for 15m. Every PVC here uses local-path with no enforced quota -- check for an unexpectedly large PVC (`kubectl get pvc -A` sorted by capacity, then `du` inside the largest pod) before assuming routine growth. See ADR 0031's own #21d finding for why this metric didn't exist until backlog #92 enabled it."

                  - alert: NodeDiskSpaceCritical
                    expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
                    for: 15m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Node root filesystem below 10% free -- real risk to the node itself, not just this project's services"
                      description: "node_filesystem_avail_bytes{mountpoint=\"/\"} has stayed below 10% of node_filesystem_size_bytes for 15m. A full disk on this single-node cluster can break k3s/etcd itself, not just an individual PVC's owner. Same first response as NodeDiskSpaceLow, treated as urgent: identify and shrink/evict the largest real consumer immediately."

                  # Blackbox synthetic probe failure (backlog #93). One
                  # alert across all three blackbox jobs (job=~"blackbox-.*")
                  # -- probe_success is the same real 0/1 signal
                  # regardless of which module/target failed, and the
                  # `instance` label on every series already names the
                  # exact real URL that broke, so a human reading this
                  # alert's own real labels (not just its summary text)
                  # already knows which endpoint to check. `for: 5m`:
                  # a single missed scrape (a real, transient network
                  # blip between blackbox-exporter and Traefik) shouldn't
                  # page; 5m of sustained failure through the real
                  # TLS/Ingress/routing chain is what backlog #93's own
                  # Purpose names -- continuous verification catching
                  # what a one-time human curl would eventually notice
                  # anyway, just faster.
                  - alert: BlackboxProbeFailing
                    expr: probe_success{job=~"blackbox-.*"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "A real public-edge probe has failed for 5m"
                      description: "probe_success is 0 for {{ $labels.instance }} (job {{ $labels.job }}) for 5m -- a real HTTP probe through the actual Ingress/TLS/routing chain, not a synthetic check. Reproduce directly: `curl --cacert adamastorx-ca.crt {{ $labels.instance }}` (add `-u blackbox:<key>` for the blackbox-http-2xx-auth job) and compare against what the failing module expects (2xx, or a real 401 for blackbox-http-401-expected). Check `kubectl get pods -n blackbox-exporter` and Traefik/cert-manager health before assuming the target service itself is down -- this probe crosses more real infrastructure (DNS via hostAliases, TLS termination, Ingress routing) than the target's own health check does."

                  # backlog #91: the one SLO a streaming pipeline actually
                  # needs -- freshness, not uptime. aggregator_price_freshness_seconds
                  # (aggregator's own Kafka Streams topology, recorded as
                  # each stock.price.tick is processed -- Micrometer
                  # auto-appends "_seconds", see AggregatorTopology's own
                  # comment) measures real trade-timestamp-to-processed
                  # lag, tagged by source. Filtered to source="WEBSOCKET"
                  # by construction, not by a separate exclusion clause --
                  # market-data-ingestor's FinnhubQuotePoller REST-poll
                  # fallback (source="POLL_FALLBACK") publishes onto this
                  # same topic every 30 minutes, by design, specifically
                  # to cover off-hours gaps; a naive unfiltered SLI would
                  # see that real, correct 30-minute lag on every
                  # fallback tick and either alert constantly (tight
                  # threshold) or go meaningless during real market
                  # hours (loose threshold) -- the exact trap this
                  # item's own Purpose names, found during roadmap
                  # review before this rule was written. The fallback's
                  # own health has its own separate alert
                  # (MarketDataStaleFeed above) and counters
                  # (market_data_quote_poll_succeeded_total), not this
                  # one.
                  #
                  # Threshold 30s, not derived from a real historical
                  # distribution this cluster doesn't have yet (same
                  # "deliberately simple v1 pick" every other SLO
                  # threshold here states) -- a real websocket trade
                  # tick's own path (Finnhub -> market-data-ingestor,
                  # under 2s per backlog #78's AC -> Kafka produce/
                  # consume -> aggregator's in-memory topology
                  # processing) should sit at a small number of seconds
                  # end to end on a healthy pipeline; 30s p95 sustained
                  # for 10m is generous single-node-dev-cluster headroom
                  # against real network/scheduling jitter, not a tight
                  # production bound.
                  - alert: AggregatorPriceFreshnessSlow
                    expr: histogram_quantile(0.95, sum(rate(aggregator_price_freshness_seconds_bucket{source="WEBSOCKET"}[10m])) by (le)) > 30
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Real-time trade ticks are taking over 30s (p95) to reach aggregator's own processing"
                      description: "aggregator_price_freshness_seconds' p95, over websocket-sourced ticks only (source=\"WEBSOCKET\" -- the 30-minute REST-poll fallback is excluded by construction, not by a threshold), has stayed above 30s for 10m. Check market-data-ingestor's own market_data_tick_publish_latency_seconds (Finnhub-to-Kafka-send latency) first to isolate whether the delay is upstream of Kafka or in aggregator's own consumption/processing (kafka_consumer_fetch_manager_records_lag{job=\"aggregator\"}, AggregatorConsumerLagHigh above)."
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
