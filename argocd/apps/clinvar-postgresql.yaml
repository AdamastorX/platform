# Dedicated PostgreSQL for clinvar-service (ADR 0019). Same chart/pattern
# as api's own postgresql.yaml (ADR 0012) -- a second, independent
# instance, not a shared database across a namespace boundary. That's
# the whole point of this ADR: ADR 0018's original design shared api's
# Postgres instance with workers across namespaces and broke on the
# Secret's namespace scoping. A second small Postgres, in
# clinvar-service's own namespace, with its own generated credential,
# sidesteps that class of bug entirely rather than working around it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clinvar-postgresql
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 16.2.1
    helm:
      valuesObject:
        fullnameOverride: clinvar-postgresql
        # Same registry override api's postgresql.yaml already needed
        # (Bitnami Secure Images transition, Aug 2025) -- same chart
        # version, same tag, so no new verification needed here.
        image:
          registry: docker.io
          repository: bitnamilegacy/postgresql
          tag: 17.1.0-debian-12-r0
        auth:
          # existingSecret migration (platform#36) -- same root cause
          # and same fix as api's own postgresql.yaml: see that file's
          # auth block comment for the full writeup. secretKeys stay at
          # the chart defaults (postgres-password / password), matching
          # this Secret's existing chart-generated key names.
          username: clinvar
          database: clinvar
          existingSecret: clinvar-postgresql
        primary:
          resourcesPreset: small
          persistence:
            size: 2Gi
        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: clinvar
  syncPolicy:
    automated:
      # prune off, same reason as api's own postgresql.yaml
      # (platform#36): this chart no longer renders a
      # "clinvar-postgresql" Secret at all, and that object already
      # exists live on this cluster -- prune: true would delete it out
      # from under the running clinvar Postgres on the next sync.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # platform#34/#36: used to need ignoreDifferences for the same
  # chart-generated-Secret non-idempotency as api's own postgresql.yaml
  # -- see that file's syncPolicy comment for the full writeup. Removed
  # here: auth.existingSecret above means the chart never emits this
  # Secret anymore, so there's nothing left to diff/regenerate.
