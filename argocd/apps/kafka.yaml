# Kafka broker for services#3 (ADR 0011: single-broker, combined
# controller+broker KRaft mode — no ZooKeeper). Helm chart source with
# values inline, same pattern as traefik/cert-manager. Broker only: the
# `workers` consumer service deploys separately once its image is
# published. Config rationale inline below and in ADR 0011.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: kafka
    targetRevision: 32.4.3
    helm:
      valuesObject:
        # Bitnami's public docker.io/bitnami/* catalog stopped publishing
        # versioned tags in Aug 2025 (Bitnami Secure Images transition) —
        # this chart's own default image (docker.io/bitnami/kafka:4.0.0-
        # debian-12-r10) 404s. docker.io/bitnamilegacy/* still hosts that
        # exact tag, frozen (no further security patches, ever). Acceptable
        # for a dev-only, ClusterIP-only broker; flagged here for human
        # review since it's an assumption, not a verified-forever fact.
        image:
          registry: docker.io
          repository: bitnamilegacy/kafka
          tag: 4.0.0-debian-12-r10
        # Single broker, combined controller+broker KRaft process (ADR
        # 0011). broker.replicaCount stays 0 (default): dedicated
        # broker-only nodes are a separate pool this chart supports but we
        # don't use — one node plays both roles.
        controller:
          replicaCount: 1
          # backlog #75: was resourcesPreset: small (512Mi request/768Mi
          # limit, confirmed live via `kubectl describe pod`) until a real
          # chaos-scenario-3 exercise (observability/chaos/03-consumer-lag.md)
          # OOMKilled the broker under a real, accumulating unconsumed
          # backlog -- KAFKA_HEAP_OPTS sizes the JVM heap to 75% of the
          # container's memory limit, leaving too little real headroom for
          # everything else (page cache for log segments especially) once
          # messages pile up. Memory bumped explicitly (not just a bigger
          # preset) since CPU was never implicated and this node's CPU is
          # already tight (98% of allocatable requested, confirmed live via
          # `kubectl describe node`) -- memory has real headroom (only 35%
          # of ~19.4Gi in limits), confirmed before picking this number, not
          # assumed. Not yet re-verified against a second real OOM
          # (backlog #75's own stated AC) -- this is the fast, defensible
          # fix given real headroom exists and CPU is the actually scarce
          # resource here; the clean isolating re-run stays open.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 1536Mi
          persistence:
            # Small single-node dev cluster, no durability requirement yet
            # (ADR 0011 accepts topic data loss on restart) — emptyDir over
            # a PVC keeps this dependency-free; revisit if that trade ever
            # needs to change.
            enabled: false
        # existingKraftSecret migration (platform#36) -- the chart used to
        # generate the KRaft cluster-id/controller-0-id pair into Secret
        # "kafka-kraft" via common.secrets.passwords.manage, same
        # non-idempotent-under-`helm template` mechanism as
        # Postgres/Redis's passwords (platform#34's root cause). Pointing
        # existingKraftSecret at that same Secret name removes the chart's
        # ability to generate/regenerate it at all; clusterId (the
        # chart's other way to set this) is ignored once
        # existingKraftSecret is set, so it's intentionally left unset
        # rather than kept alongside a now-unused value. controller.
        # replicaCount is 1, so the referenced Secret needs exactly one
        # cluster-id key plus one controller-0-id key (confirmed against
        # the chart's templates/secrets.yaml). Provisioning:
        # bootstrap/README.md and bootstrap/create-stateful-secrets.sh.
        existingKraftSecret: kafka-kraft
        broker:
          replicaCount: 0
        # Chart defaults every listener to SASL_PLAINTEXT with generated
        # credentials. Nothing outside the cluster ever talks to Kafka
        # (ClusterIP only, no externalAccess) and there's no service mesh
        # (PROJECT.md excludes one) — same no-auth-between-in-cluster-
        # services trust model api's own Ingress/Service already use (ADR
        # 0010, superseded by ADR 0021's removal of `gateway`, but its
        # trust-model reasoning still applies). PLAINTEXT avoids standing
        # up Secret-based credential rotation for a dev broker nothing
        # external can reach.
        listeners:
          client:
            protocol: PLAINTEXT
          controller:
            protocol: PLAINTEXT
          interbroker:
            protocol: PLAINTEXT
        service:
          type: ClusterIP
        externalAccess:
          enabled: false
        # Kafka's internal topics default to replication.factor=3
        # regardless of how many brokers actually exist. With one broker
        # that's unsatisfiable: __consumer_offsets can never finish
        # auto-creating, every consumer group's FIND_COORDINATOR call
        # times out, and no @KafkaListener (workers, services#3) can ever
        # join a group -- discovered when workers first deployed and its
        # consumer group never formed. RF=1 everywhere is already this
        # cluster's reality (ADR 0011); these three just extend that to
        # Kafka's own internal bookkeeping topics instead of leaving them
        # on the multi-broker-cluster default.
        #
        # overrideConfiguration, not config: the chart's
        # controller-eligible ConfigMap template only emits its own
        # auto-derived base config (process.roles, listeners, log.dir,
        # ...) when `config`/`controller.config` is UNSET -- setting
        # either one replaces the whole server.properties with exactly
        # what's given here, wholesale, no merge. Learned this by
        # crash-looping the broker: `config:` with just these 3 lines
        # produced a server.properties with only these 3 lines, and
        # kafka-storage.sh format died on "Missing required configuration
        # process.roles". overrideConfiguration merges on top of the
        # generated base instead.
        #
        # auto.create.topics.enable: false -- api/workers both connect
        # with allow.auto.create.topics=true (spring-kafka client
        # default) and previously raced the provisioning Job below: on
        # every fresh broker (podrecreate, no persistence), whichever
        # got there first created work-items with the *broker's* default
        # partition count (1), not the 3 this topic actually needs
        # (ADR 0011) -- the Job's --if-not-exists then silently no-op'd.
        # Forcing topic creation through the Job (the only thing this
        # setting doesn't block) makes that race impossible instead of
        # needing a manual kafka-topics.sh --alter after the fact, which
        # is what happened the first time this was hit. Internal topics
        # (__consumer_offsets, __transaction_state) are unaffected --
        # the group/transaction coordinators create those themselves
        # regardless of this setting.
        overrideConfiguration:
          offsets.topic.replication.factor: 1
          transaction.state.log.replication.factor: 1
          transaction.state.log.min.isr: 1
          auto.create.topics.enable: false
        # Declarative topic provisioning via the chart's built-in Job —
        # simplest option that satisfies ADR 0011's work-items topic
        # (3 partitions, RF=1) without a hand-written Job manifest.
        #
        # backlog #81 (aggregator, M13, ADR 0029) reads stock.price.tick
        # and news.sentiment.scored below as its two inputs -- no new
        # entry needed for either. It also does NOT need a hand-provisioned
        # entry here for its own internal changelog topics
        # (aggregator-price-window-store-changelog,
        # aggregator-sentiment-window-store-changelog): Kafka Streams
        # creates and manages those itself via its own internal
        # AdminClient on startup, entirely independent of this Job and of
        # auto.create.topics.enable above (that setting only affects
        # broker-side auto-creation triggered by an ordinary produce/fetch
        # request, not Kafka Streams' own explicit CreateTopics calls for
        # its internal topics -- confirmed live: aggregator's own test
        # suite exercises this exact path against a real embedded broker
        # with auto.create.topics.enable at its own default, and the
        # changelog topics come up correctly). Their replication factor
        # follows this broker's own default.replication.factor (left
        # unset above, so it's Kafka's own factory default of 1) -- the
        # same RF=1 every other topic here already uses for the same
        # single-broker reason (ADR 0011), not something this Job needs
        # to state a second time.
        provisioning:
          enabled: true
          topics:
            - name: work-items
              partitions: 3
              replicationFactor: 1
            # backlog #78 (ADR 0029, M13): market-data-ingestor's real
            # trade-tick event. Same 3-partitions/RF=1 shape as work-items
            # (this single-broker dev cluster, ADR 0011) -- 3 partitions is
            # more than this one producer needs today, but matches the
            # established convention rather than inventing a
            # smaller-topic special case, and leaves room for #81
            # (aggregator, the topic's first real consumer) to run more
            # than one instance later without a partition-count migration.
            # Provisioned through this same Job, not a hand-run
            # `kafka-topics.sh --create` -- see docs/SESSION_STATE.md
            # (adamastorx repo) for when that manual command is the real,
            # sanctioned fallback (recovering a topic after a broker
            # restart raced this Job, not routine provisioning).
            - name: stock.price.tick
              partitions: 3
              replicationFactor: 1
            # backlog #79 (M13, ADR 0029): news-ingestor's output topic.
            # RF=1 for the same single-broker reason every other topic
            # here is (ADR 0011). 1 partition, not 3 like work-items --
            # there is exactly one producer (news-ingestor, a single
            # replica, see kubernetes/news-ingestor/deployment.yaml) and
            # this milestone's traffic is a handful of matched articles
            # per 5-minute poll cycle, not the kind of throughput 3-way
            # parallelism would ever help with; add partitions later if
            # #80 (sentiment-analyzer)'s consumer group ever needs the
            # parallelism, not speculatively now.
            - name: news.article.published
              partitions: 1
              replicationFactor: 1
            # backlog #80 (M13, ADR 0029): sentiment-analyzer's output
            # topic. RF=1, same single-broker reason every topic here is
            # (ADR 0011). 1 partition, matching news.article.published's
            # own reasoning: exactly one producer (sentiment-analyzer, a
            # single replica, see kubernetes/sentiment-analyzer/deployment.yaml)
            # and this milestone's traffic is a handful of scored
            # (article, ticker) events per news-ingestor poll cycle, not
            # throughput 3-way parallelism would ever help with; add
            # partitions later if #81 (aggregator)'s consumer group ever
            # needs the parallelism, not speculatively now.
            - name: news.sentiment.scored
              partitions: 1
              replicationFactor: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      # prune off, same reason as postgresql.yaml/redis.yaml
      # (platform#36): existingKraftSecret above means this chart no
      # longer renders a "kafka-kraft" Secret at all, and that object
      # already exists live on this cluster -- prune: true would delete
      # it out from under the running broker on the next sync.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # platform#34/#36: PLAINTEXT listeners mean there's no SASL credential
  # at risk here, but the chart's Secret "kafka-kraft" (cluster-id,
  # controller-0-id) used the same common.secrets.passwords.manage
  # auto-generation mechanism as Postgres/Redis's passwords -- confirmed
  # by rendering this chart twice in a row, offline, with identical
  # inputs: both values differed on every render. Removed here:
  # existingKraftSecret above means the chart never emits this Secret
  # anymore, so there's nothing left for selfHeal to diff/regenerate.
