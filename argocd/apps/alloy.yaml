# Alloy for observability#3 (ADR 0015). Own `alloy` namespace, DaemonSet
# (chart default -- log collection is inherently per-node, unlike the
# OTel Collector's centralized `mode: deployment` for OTLP push).
#
# Alloy, not Promtail: Promtail is grafana/helm-charts' deprecated
# predecessor (deprecated: true, same finding as Tempo/the old Loki
# repo), Alloy is its actively-maintained replacement and still lives
# on the non-deprecated grafana.github.io/helm-charts repo.
#
# Explicit River config (not the higher-abstraction `k8s-monitoring`
# meta-chart) -- same "explicit pipeline over a bundled black box"
# choice already made for Prometheus's scrape configs and the OTel
# Collector's pipeline. loki.source.kubernetes (API-based log read) is
# used instead of the traditional loki.source.file + hostPath-mount
# approach Promtail used: no /var/log mount or container-runtime-
# specific path assumptions, just RBAC on pods/pods/log/namespaces.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.11.0
    helm:
      valuesObject:
        fullnameOverride: alloy
        rbac:
          create: true
          clusterRules:
            - apiGroups: [""]
              resources: ["pods", "pods/log", "namespaces", "nodes"]
              verbs: ["get", "list", "watch"]
        alloy:
          # backlog #103 (ADR 0037, adamastorx repo): the Faro receiver
          # port, exposed on both the container and this chart's own
          # Service -- the chart's own values.yaml carries this exact
          # "faro"/12347 shape as its own commented-out example,
          # confirmed by pulling the chart locally before using it, not
          # guessed. kubernetes/alloy-ingress/ (a separate Application,
          # same "standalone Ingress for a chart with no ingress key"
          # pattern as alertmanager-ingress) is what actually makes this
          # port reachable from a real browser. Found live (rendering
          # this chart locally before committing) that extraPorts must
          # nest directly under `alloy:`, not under `rbac:` -- the
          # Service template merges it from $values := .Values.alloy,
          # a sibling key gets silently ignored rather than erroring.
          extraPorts:
            - name: faro
              port: 12347
              targetPort: 12347
              protocol: TCP
          configMap:
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

              // backlog #103 (ADR 0037): frontend RUM from visualizer/
              // clinvar-viewer's own Faro Web SDK. Reuses this same
              // Alloy DaemonSet and the existing loki.write above --
              // Tempo (observability#3, ADR 0015) is already running
              // too, so this is genuinely zero new stateful
              // infrastructure, only new pipeline wiring on components
              // already deployed for the log-shipping role above.
              faro.receiver "default" {
                // JSON, not the logfmt default -- the Faro payload's
                // fields (app_name, kind, message, page URL, ...) are
                // what the frontend-RUM dashboard's own LogQL queries
                // (`| json`) filter and group on; JSON parses more
                // reliably than logfmt for a payload this project
                // doesn't control the shape of. extra_log_labels is
                // the only source of real Loki labels this component
                // adds (confirmed reading the component's own Go
                // source before relying on it) -- one static "job"
                // label so this is a real, queryable stream, same
                // convention the pod-log pipeline above already uses.
                extra_log_labels = {
                  job = "faro",
                }
                log_format = "json"

                server {
                  listen_address       = "0.0.0.0"
                  listen_port          = 12347
                  cors_allowed_origins = [
                    "https://visualizer.local.adamastorx.test",
                    "https://clinvar-viewer.local.adamastorx.test",
                  ]
                }

                output {
                  logs   = [loki.write.default.receiver]
                  traces = [otelcol.exporter.otlphttp.tempo.input]
                }
              }

              otelcol.exporter.otlphttp "tempo" {
                client {
                  endpoint = "http://tempo.tempo.svc.cluster.local:4318"
                  tls {
                    insecure = true
                  }
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: alloy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
