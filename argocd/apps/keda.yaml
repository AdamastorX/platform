# KEDA: event-driven autoscaling for backlog #63. Helm chart source with
# values inline, same pattern as every other platform component (ADR
# 0003). Own `keda` namespace -- a cluster-wide controller with its own
# CRDs (ScaledObject/ScaledJob/TriggerAuthentication), not tied to any
# one workload's namespace, same reasoning already used for Argo
# Rollouts/cert-manager/Prometheus.
#
# Version 2.20.2 (appVersion 2.20.2) -- the current chart-repo head at
# the time this was written (`curl -s https://kedacore.github.io/charts/
# index.yaml`, sorted by `created`), no reason to pin behind head for a
# brand-new install. Values verified against the real chart before
# writing this file (chart downloaded and `values.yaml`/`templates/`
# read directly), not assumed from memory or docs -- this project's
# established discipline (see prometheus.yaml/argo-rollouts.yaml's own
# comments for the same pattern).
#
# The actual ScaledObject that scales `workers` lives in
# kubernetes/workers/scaledobject.yaml (same Application/path as
# workers' own Deployment) -- this Application is KEDA's control plane
# only (operator, metrics adapter, CRDs), not the scaling policy itself.
# First-install ordering: `workers`' ScaledObject needs KEDA's CRDs to
# exist before ArgoCD can apply it; both Applications sync independently
# under the root app-of-apps (ADR 0003), so on a brand-new cluster the
# `workers` Application's first sync attempt may fail once (CRD not yet
# registered) and succeed on ArgoCD's automatic retry once this
# Application's CRDs land -- same self-healing shape cert-manager's own
# Issuer CRDs already rely on for cert-manager-issuers.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.20.2
    helm:
      valuesObject:
        # Real, checked constraint (not assumed): `kubectl describe node`
        # on this single-node cluster showed CPU already at 3935m/4000m
        # allocatable (98%) requested before this Application existed --
        # confirmed live the same session this file was written, see
        # this backlog item's PR description for the exact numbers.
        # Memory has real headroom (21%/39% of allocatable requested/
        # limited) -- the same asymmetry backlog #75 already found and
        # used to size Kafka's memory bump. That means every CPU
        # request KEDA's own control plane adds competes directly for a
        # resource this node barely has left, while memory is cheap
        # here. Three deliberate trims from the chart's own defaults,
        # each stated:
        #
        # 1. Admission webhooks disabled entirely (chart default:
        #    enabled) -- a third pod, a third 100m CPU request, for a
        #    component that only validates ScaledObject/
        #    TriggerAuthentication syntax on create/update. This
        #    project's manifests are already kubeconform-validated in CI
        #    (.github/workflows/ci.yml) against the real KEDA CRD schema
        #    before merge, which is most of what the webhook would catch
        #    anyway -- an acceptable trade given the real CPU scarcity,
        #    not a default left unexamined.
        # 2. Operator and metrics-apiserver CPU *requests* trimmed from
        #    the chart's own 100m/100m default to 30m/30m each (60m
        #    total) -- both are lightweight, mostly-idle Go controllers
        #    on this single-workload dev cluster (one ScaledObject, one
        #    Kafka trigger), not the chart's own multi-tenant-cluster
        #    sizing assumption. CPU *limits* are left high (chart
        #    default 1 core) so a real burst isn't throttled -- only the
        #    scheduling-time request was tightened, the actual ceiling
        #    wasn't.
        # 3. Memory requests/limits are left at the chart's own generous
        #    defaults (100Mi request / 1000Mi limit each) -- this is
        #    exactly the resource this node has real slack in, no reason
        #    to trim it.
        #
        # Stated honestly, not glossed: even at 60m combined, this still
        # leaves an uncomfortably thin real margin against a node
        # already at 98% CPU requested (~65m of true headroom measured
        # live before this change) -- barely fits, not comfortably fits.
        # If it doesn't schedule in practice, that's a real, separately
        # flagged finding for a human to confirm post-merge (PR
        # description), not something forced by trimming further into
        # "no CPU request at all" territory, which would remove any real
        # scheduling guarantee for a controller this project now depends
        # on to react to a real incident signal.
        webhooks:
          enabled: false
        resources:
          operator:
            requests:
              cpu: 30m
              memory: 100Mi
            limits:
              cpu: 1
              memory: 1000Mi
          metricServer:
            requests:
              cpu: 30m
              memory: 100Mi
            limits:
              cpu: 1
              memory: 1000Mi
        # Operator's own Prometheus self-monitoring metrics (keda_scaler_*,
        # keda_scaled_object_paused, ...) -- confirmed against KEDA
        # 2.20.2's real source (pkg/metricscollector/prommetrics.go: metric
        # namespace "keda", scale-decision recording calls live in
        # pkg/scaling/scale_handler.go, which cmd/operator/main.go runs --
        # not the metrics-apiserver process) before enabling this rather
        # than assumed from the chart's own comment. Scraped by Prometheus
        # via extraScrapeConfigs (argocd/apps/prometheus.yaml), pod-role
        # discovery on the container's own "metrics" port, same pattern as
        # workers/traefik. metricServer's own separate prometheus.metricServer
        # flag stays disabled (chart default) -- it covers the metrics
        # -apiserver process's own self-monitoring, not the scale-decision
        # signal this backlog item actually wants visible.
        prometheus:
          operator:
            enabled: true
            port: 8080
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Same lesson as cert-manager.yaml / argo-rollouts.yaml: KEDA's
      # ScaledObject/ScaledJob/TriggerAuthentication/
      # ClusterTriggerAuthentication CRDs are real, sizeable YAML --
      # ServerSideApply avoids client-side apply's 256KB
      # last-applied-configuration annotation limit the same way it did
      # for those two.
      - ServerSideApply=true
