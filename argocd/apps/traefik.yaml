# Traefik ingress controller. k3s's bundled Traefik is disabled
# (--disable traefik), so this is the GitOps-managed replacement.
# Helm chart source with values inline — split into a values file only
# if this grows. Config rationale: ../README.md#traefik.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.0.2
    helm:
      valuesObject:
        # backlog #114: found live 2026-08-07 -- no resources block since
        # this chart's first deploy. Real measured usage (`kubectl top
        # pod`) ~2-3m CPU/38Mi memory -- sized with generous headroom
        # anyway (Traefik is the sole ingress path for every public
        # hostname in this cluster; under-provisioning it has an
        # outsized blast radius relative to its idle footprint), same
        # "never unconstrained" convention as every other component
        # here.
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
        # No ServiceLB (k3s --disable servicelb) and no cloud LB: a
        # LoadBalancer Service would sit <pending> forever. Traffic enters
        # via hostPort below; the Service stays ClusterIP for in-cluster use.
        service:
          spec:
            type: ClusterIP
        # Single node, host ports 80/443 free: bind them directly.
        # Real ports, no :3xxxx NodePort noise. Revisit if the cluster
        # ever gains more nodes or a load balancer.
        ports:
          web:
            hostPort: 80
          websecure:
            hostPort: 443
        # hostPort + single node: the chart's default RollingUpdate
        # (maxSurge 1) can never schedule the surge pod — the port is
        # already bound — and upgrades deadlock. Brief downtime instead.
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        providers:
          kubernetesIngress:
            # publishedService copies the LoadBalancer status of Traefik's
            # Service onto Ingresses — a ClusterIP Service has none, so
            # Ingress .status would stay empty and ArgoCD would report the
            # owning app Progressing forever. Publish the node IP instead.
            # Status-only cosmetics: traffic reaches Traefik via hostPort
            # on whatever IP the node actually has.
            publishedService:
              enabled: false
            ingressEndpoint:
              ip: 192.168.1.10
        # backlog #56: per-key request-rate visibility. Traefik's own
        # Prometheus metrics (metrics.prometheus below) have no header/
        # basic-auth-username label by design (real cardinality-explosion
        # guard on Traefik's part -- one label per distinct source would
        # scale metric cardinality with the number of tenants, unbounded),
        # so "per-key request rates" can't come from a Prometheus counter
        # here at all, not just a config oversight. Access logs carry it
        # instead: Traefik's JSON access log includes a `ClientUsername`
        # field for any Basic-auth-protected route (confirmed against
        # this exact chart/version's own schema -- see
        # v41.0.2/traefik/values.yaml's accessLog block -- before adding
        # this, not assumed), which Alloy already ships to Loki for every
        # container's stdout (ADR 0013) with no extra wiring. The
        # dashboard panel querying it: argocd/apps/grafana.yaml.
        #
        # Chart default is accessLog.enabled: false -- confirmed live
        # against the running pod's own args before this change (no
        # --accesslog flag present). Enabling it (like any values change
        # to this chart) triggers the RollingUpdate above -- brief,
        # already-accepted downtime (maxSurge: 0 can't schedule a surge
        # pod on this single node's bound hostPorts), same tradeoff every
        # prior Traefik values/version bump on this cluster has taken.
        accessLog:
          enabled: true
          format: json
        # addRoutersLabels (default false): without this, 429/401 counts
        # only ever show up on the shared `websecure` entrypoint metric
        # (every public host), not attributable to api's router
        # specifically once a second Ingress ever gets its own rate
        # limit -- flipped on so that becomes possible without another
        # chart-values change later. addServicesLabels/addEntryPointsLabels
        # already default true; left alone.
        metrics:
          prometheus:
            addRoutersLabels: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Chart ships CRDs approaching the 256KB client-side annotation
      # limit (traefikservices ~96KB); server-side apply avoids the cliff.
      - ServerSideApply=true
