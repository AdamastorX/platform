# First deploy of the workers service (services#3 AC "a message produced
# by API is consumed by a worker") — bootstraps its existence in-cluster
# per ADR 0009. No Service (ADR 0011: workers has no business HTTP API,
# nothing calls it — it only consumes from Kafka). Future SHA bumps are
# one-line image-tag diffs to kubernetes/workers/deployment.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AdamastorX/platform
    targetRevision: main
    path: kubernetes/workers
  destination:
    server: https://kubernetes.default.svc
    namespace: workers
  # TEMPORARY, backlog #75 clean re-run (chaos scenario 3 at the
  # unmodified default rate, isolating backlog-size from the elevated
  # test rate the first run couldn't separate). Same real pause already
  # proven for this exact need (#73/#75's own prior sync-pauses).
  # Reverted via a follow-up PR once the scenario is done.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
