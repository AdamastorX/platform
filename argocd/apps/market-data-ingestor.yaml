# First deploy of market-data-ingestor (backlog #78, ADR 0029/M13) --
# bootstraps its existence in-cluster per ADR 0009, same pattern as
# workers/watchlist-service's own first-deploy Application. No Service
# (ADR 0009/0011: no business HTTP API, nothing calls it -- it only
# subscribes to Finnhub over a websocket and produces to Kafka).
#
# M7's hardware gate on this whole milestone was overridden by the owner
# 2026-08-02 (docs/roadmap/backlog.md's M13 section, adamastorx repo):
# development proceeds now on the current single-node cluster, but live
# deployment is deliberately incremental -- one service at a time, with a
# real `kubectl describe node` headroom check before each sync, not this
# whole milestone's five services applied at once. This Application is
# reviewed and merged on that basis; whether/when ArgoCD is actually
# pointed at this file (or its sync is triggered) is a separate, real
# decision for a human to make at deploy time, not implied by this PR's
# merge alone.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: market-data-ingestor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AdamastorX/platform
    targetRevision: main
    path: kubernetes/market-data-ingestor
  destination:
    server: https://kubernetes.default.svc
    # Namespace already exists on the real cluster (created ahead of this
    # PR, alongside the already-provisioned finnhub-api-key Secret) --
    # CreateNamespace=true below is still set for the same reason every
    # other Application here sets it: a fresh/rebuilt cluster applying
    # this file from scratch must not depend on that manual step having
    # already happened.
    namespace: market-data-ingestor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
