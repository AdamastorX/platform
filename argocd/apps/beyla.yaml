# Grafana Beyla for backlog #102 (ADR 0036, adamastorx repo): an eBPF
# auto-instrumentation A/B experiment against api/workers/aggregator's
# own existing manual Micrometer/OTel instrumentation, on the same
# cluster, at the same time.
#
# Own `beyla` namespace, same "one namespace per component" pattern as
# every other tool here. No PVC, no other component depends on this
# one -- deleting this Application and its Prometheus scrape-config
# block is the entire rollback path (ADR 0036).
#
# Unprivileged mode (privileged: false), not the chart's `privileged:
# true` default -- checked live against the chart's own
# daemon-set.yaml template before choosing this, not assumed from the
# values.yaml comment: this grants a specific capability set (BPF,
# SYS_PTRACE, NET_RAW, CHECKPOINT_RESTORE, DAC_READ_SEARCH, PERFMON,
# SYS_ADMIN, +NET_ADMIN for contextPropagation) rather than the full
# host-device/breakout grant `privileged: true` implies. The chart's
# DaemonSet also sets hostPID/hostNetwork unconditionally (eBPF needs
# node-wide process/socket visibility) -- checked via `helm template`
# before committing to this, not assumed. Still real, bounded
# privilege -- ADR 0036 states honestly that this is narrower than
# `privileged: true`, not equivalent to ADR 0028's fully unprivileged
# OTel-agent-injection precedent (eBPF tracing needs kernel-level
# access no injected-agent approach does).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beyla
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: beyla
    targetRevision: 1.16.10
    helm:
      valuesObject:
        fullnameOverride: beyla
        privileged: false
        contextPropagation:
          enabled: true
        preset: application
        config:
          create: true
          data:
            attributes:
              kubernetes:
                enable: true
            prometheus_export:
              port: 9090
              path: /metrics
        service:
          enabled: true
          port: 80
          targetPort: 9090
        # Real memcg OOM found live, not guessed: the first deploy's
        # provisional 256Mi limit (otel-collector's own per-node-agent
        # starting point) killed the container every ~30-90s --
        # `dmesg`'s own oom-killer log showed real anon-rss ~253Mi +
        # file-rss ~55Mi (~308Mi total) against that 256Mi cgroup
        # limit, same "measured peak, not guessed" lesson Tempo's own
        # resources comment already recorded for its own startup burst
        # (argocd/apps/tempo.yaml). A live `kubectl patch` bumping this
        # in-cluster without a matching git commit was reverted by
        # ArgoCD's own selfHeal before it could be validated -- the fix
        # only actually took effect once committed here.
        #
        # 2026-10-04: 1Gi was hit again. The host's kernel log shows
        # memcg OOM kills of beyla at ~750Mi anon-rss (the cgroup also
        # counts page cache and BPF map memory) five times in 12h on
        # 2026-10-03/04, exit 137 with reason `Error`, not `OOMKilled`;
        # the working set sits at ~820-910Mi and grows ~20Mi/h, so the
        # pod restarted every few hours and its scrape target flapped
        # (`connection reset by peer`, up{job="beyla"}=0), starving the
        # beyla-vs-manual dashboard (backlog #145). The node itself has
        # ~60GB RAM with ~39GB free and the 8GB swap unused: this is a
        # per-container limit sized for the old host, not node pressure.
        # 2Gi gives ~2x headroom at the current growth rate; it does not
        # fix the growth itself, which #145 should still characterize.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: beyla
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
