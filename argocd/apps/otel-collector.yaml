# OpenTelemetry Collector for observability#1 (ADR 0013). Official
# open-telemetry Helm chart (not Bitnami — no registry-migration
# workaround needed, verified against Docker Hub directly), same
# inline-valuesObject pattern as Kafka/Postgres. Traces only: metrics
# stay on each service's /actuator/prometheus scrape endpoint (ADR
# 0014), logs stay in console output, shipped to Loki by Alloy directly
# rather than through this Collector (ADR 0015) — routing either
# through this Collector would add a hop this project never actually
# uses.
#
# Own `otel` namespace (ADR 0009's per-component pattern, same reasoning
# as Kafka): two consumers (api, workers both push to it — `gateway` was
# a third until ADR 0021/backlog #S1 removed it), and no credential to
# worry about — the OTLP receiver is open to the
# cluster like Kafka's PLAINTEXT listener, nothing outside the cluster
# reaches it. Unlike Postgres, there's no secretKeyRef cross-namespace
# problem here to force it into a consumer's own namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.165.0
    helm:
      valuesObject:
        # fullnameOverride keeps the Service name short and predictable
        # (otel-collector.otel.svc.cluster.local) instead of the chart's
        # default <release>-<chart> concatenation.
        fullnameOverride: otel-collector
        mode: deployment
        image:
          # Core distribution, not -contrib: the only components this
          # needs (otlp receiver, batch/memory_limiter processors,
          # debug exporter) are all in core, and the chart's default
          # config already wires exactly that trace pipeline —
          # verified by rendering the chart locally against these
          # exact values before writing this file.
          repository: otel/opentelemetry-collector
        command:
          name: otelcol
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        # The collector's own self-monitoring metrics (:8888, chart's
        # default telemetry config -- already scraped by Prometheus,
        # ADR 0014) are exposed on the container itself regardless, but
        # the chart's `ports.metrics` entry is `enabled: false` by
        # default -- meaning the Service never got a port for it, so
        # Service-DNS scraping timed out on connect. Found deploying the
        # real Prometheus scrape (the pod itself was always listening).
        ports:
          metrics:
            enabled: true
        # Traces now export to Tempo (ADR 0015), replacing the `debug`
        # placeholder exporter -- its job (proving spans exist by
        # eyeballing Collector logs) is superseded by a real, queryable
        # backend. Confirmed this `config` values key deep-merges with
        # the chart's own defaults (only this exporters list gets
        # replaced, receivers/processors untouched) by rendering the
        # chart locally first. The unused jaeger/zipkin receivers, the
        # metrics/logs pipelines, and the now-orphaned `debug` exporter
        # definition are inert and not worth fighting Helm's
        # null-based config trimming to remove for a marginal cleanup
        # (same precedent as leaving jaeger/zipkin in place already).
        config:
          exporters:
            otlp/tempo:
              endpoint: tempo.tempo.svc.cluster.local:4317
              tls:
                insecure: true
          service:
            pipelines:
              traces:
                exporters: [otlp/tempo]
  destination:
    server: https://kubernetes.default.svc
    namespace: otel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
