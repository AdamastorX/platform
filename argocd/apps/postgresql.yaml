# PostgreSQL for services#4 (ADR 0012). Helm chart source with values
# inline, same pattern as Kafka/Traefik/cert-manager. Single instance,
# no read replicas, ClusterIP only -- api reaches it through Kubernetes
# Service DNS (postgresql.api.svc.cluster.local), same trust model as
# every other in-cluster service here (no auth between services,
# ADR 0010).
#
# Deployed into api's namespace, not its own -- unlike Kafka (two
# consumers, api and workers, and no credential at all since it's
# PLAINTEXT), Postgres has exactly one consumer and does need a
# password: the chart's generated Secret has to live in the same
# namespace as the Deployment reading it via secretKeyRef, which
# can't cross namespaces (ADR 0012).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 16.2.1
    helm:
      valuesObject:
        # Same docker.io/bitnami/* -> docker.io/bitnamilegacy/* registry
        # swap ADR 0011 already needed for Kafka (Bitnami Secure Images
        # transition, Aug 2025) -- re-verified for this chart/tag
        # specifically against Docker Hub's registry API, not assumed
        # from precedent alone.
        image:
          registry: docker.io
          repository: bitnamilegacy/postgresql
          tag: 17.1.0-debian-12-r0
        auth:
          # A dedicated least-privilege user + database, not the
          # postgres superuser (ADR 0012). auth.password used to be left
          # unset so the chart generated a random one into a Secret via
          # common.secrets.passwords.manage -- platform#36 migrates off
          # that entirely (root fix for platform#34: that generator's
          # "reuse the existing Secret" idempotency needs a live-cluster
          # Helm lookup() that ArgoCD's `helm template` rendering never
          # performs, so every automated sync could mint a brand-new
          # password the running container was never started with --
          # see docs/SESSION_STATE.md's root-cause writeup). existingSecret
          # points at a Secret this chart can no longer create or
          # regenerate; secretKeys stay at the chart's own defaults
          # (postgres-password / password), the same key names the
          # chart-generated Secret already used, so the live Secret
          # needs no rename. Provisioning: bootstrap/README.md and
          # bootstrap/create-stateful-secrets.sh -- no credential ever
          # lives in git (see that script's header for the
          # plaintext-in-git-vs-out-of-band tradeoff this decided).
          username: api
          database: api
          existingSecret: postgresql
        primary:
          # TEMPORARY, backlog #73: live pg_hba.conf edit + reload isn't
          # possible on this cluster -- confirmed live, kubectl exec
          # cannot signal PID 1 inside the container (`pg_ctl reload`/
          # `kill -HUP 1` both real "Permission denied", a container-
          # runtime restriction, not a Postgres one) -- and pg_hba.conf
          # itself lives on the pod's own emptyDir, regenerated fresh by
          # the Bitnami entrypoint on every restart, so a live in-container
          # edit can't survive the restart it would need anyway. The only
          # real path is a committed chart-values change, which recreates
          # the pod with this baked in from the start. `local all postgres
          # trust` prepended ahead of the chart's own default rules
          # (unchanged below it) -- narrow: local Unix-socket connections
          # only, `postgres` user only, nothing else affected. Reverted via
          # a follow-up PR immediately after the password is fixed.
          pgHbaConfiguration: |-
            local all postgres trust
            host     all             all             0.0.0.0/0               md5
            host     all             all             ::/0                    md5
            local    all             all                                     md5
            host     all             all        127.0.0.1/32                 md5
            host     all             all        ::1/128                      md5
          # backlog #77: resourcesPreset: small (500m/750m cpu) was the
          # chart default carried over unexamined since ADR 0012 -- real
          # `kubectl top pod` usage on the live cluster sat at 12m
          # steady-state (sampled twice, ~2 min apart, same order of
          # magnitude both times: 12m/12m), 2-4% of the 500m request.
          # Explicit resources: below drops the CPU *request* to 100m
          # (still >8x observed usage) while leaving the CPU *limit*
          # (750m) and both memory values exactly at the "small" preset's
          # own numbers unchanged -- this is a steady-state request trim,
          # not a burst-capacity change, and memory already has real slack
          # cluster-wide so it isn't touched either. `resources:` here
          # takes precedence over resourcesPreset in this chart's helper
          # (common.resources.preset), so resourcesPreset above is now
          # inert; left in place as a comment-free no-op rather than
          # removed, so the "small" starting point this diverged from
          # stays visible.
          resourcesPreset: small
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 768Mi
          persistence:
            # A real PVC, not emptyDir -- the one deliberate break from
            # Kafka's precedent (ADR 0011 explicitly accepted losing
            # topic data on restart; "durable state" for Postgres needs
            # to actually mean something). storageClass left at the
            # chart's empty-string default, which resolves to the
            # cluster's default StorageClass -- k3s ships `local-path`
            # as that default already, no new provisioner needed.
            size: 2Gi
        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: api
  syncPolicy:
    automated:
      # prune left off deliberately, platform#36: existingSecret above
      # means this chart no longer renders a "postgresql" Secret object
      # at all. On this already-bootstrapped cluster that object still
      # exists live (pre-existing, now out-of-band-managed per
      # bootstrap/README.md) -- with prune: true, the very next sync
      # would see a live resource this Application previously created
      # but no longer renders, and delete it out from under the running
      # Postgres container. That's exactly the kind of live-Secret
      # deletion this migration must not cause, so prune stays off for
      # this Application. selfHeal is unaffected (it only reverts drift
      # on resources still in the rendered set) and still protects
      # everything else this Application manages.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # platform#34/#36: this Application used to need ignoreDifferences on
  # the chart-generated "postgresql" Secret's /data, because ArgoCD's
  # repo-server renders this chart via `helm template`, which never has
  # live cluster access -- confirmed by running `helm template` twice in
  # a row, offline, with identical chart/version/values and no commits
  # in between: `data.password`/`postgres-password` differed on every
  # single invocation. common.secrets.passwords.manage's "reuse the
  # existing Secret" idempotency relies on a Helm lookup() against a
  # live cluster, which `helm template` cannot do. That block is removed
  # here (platform#36): auth.existingSecret above means the chart never
  # emits that Secret at all anymore, so there's nothing left for
  # selfHeal to regenerate or diff against -- the ignoreDifferences
  # workaround is no longer needed, not left in place redundantly.
