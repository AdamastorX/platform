# backlog #50: prometheus namespace's real NetworkPolicies -- fifth
# real batch, and by far the largest fan-out (Prometheus talks to
# nearly the whole cluster). Two of this namespace's four real pods
# (prometheus-server, kube-state-metrics) get a policy; node-exporter
# (hostNetwork, no distinct Cilium endpoint) and alertmanager (a real,
# live ntfy webhook egress blocked on the same DNS-proxy bug as NCBI/
# GitHub) deliberately do not -- see kube-state-metrics.yaml's own
# header for the real reasoning.
#
# No rules.dns/toFQDNs anywhere in either policy, same discipline as
# every sibling batch since platform#156's fix.
#
# Deliberately NOT auto-synced on first apply, same reasoning as the
# sibling network-policies Applications/cilium.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-network-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AdamastorX/platform
    targetRevision: main
    path: kubernetes/prometheus-network-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
