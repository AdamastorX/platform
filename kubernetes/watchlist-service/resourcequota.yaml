# platform#35 pattern: bounds total consumption of the `watchlist`
# namespace (watchlist-service Deployment + the watchlist-postgresql Helm
# chart, both deployed here per backlog #53).
#
# Originally estimated (this workload had never run on the cluster when
# this manifest was first written), now re-sized against real usage --
# backlog #77's node-wide CPU audit was the first time real `kubectl top`
# numbers existed for this namespace:
#   watchlist-service:     requests cpu=100m mem=256Mi, limits cpu=1 mem=512Mi
#                          (backlog #77: CPU request trimmed from the
#                          original 250m estimate -- real usage sampled at
#                          3-4m, one of the largest gaps found in that
#                          audit. Limit/memory untouched)
#   watchlist-postgresql:  requests cpu=100m mem=512Mi, limits cpu=750m mem=768Mi
#                          (backlog #77: CPU request trimmed from the
#                          chart's resourcesPreset: small default of 500m --
#                          real usage sampled at 14-22m. Limit/memory
#                          untouched)
# Steady-state totals: requests cpu=200m mem=768Mi, limits cpu=1750m mem=1280Mi.
# A rolling update of watchlist-service (default maxSurge=1) briefly adds
# +100m/+256Mi requests and +1000m/+512Mi limits at peak. Quota below
# clears that real peak with headroom.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
spec:
  hard:
    requests.cpu: 1250m
    requests.memory: 1536Mi
    limits.cpu: 3000m
    limits.memory: 2Gi
