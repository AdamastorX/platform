apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchlist-service
  labels:
    app: watchlist-service
spec:
  # A plain Deployment, deliberately NOT a Rollout -- backlog #46's canary +
  # automated-SLO-gate pattern was applied only to api (see
  # kubernetes/api/rollout.yaml's own comment: api is the one service with a
  # real, already-dated incident and continuous real traffic from #45's
  # generator today). watchlist-service has neither yet; extending the
  # canary pattern here without a real reason would be exactly the kind of
  # build-ahead-of-need ADR 0021 exists to rule out.
  replicas: 1
  selector:
    matchLabels:
      app: watchlist-service
  template:
    metadata:
      labels:
        app: watchlist-service
    spec:
      containers:
        - name: watchlist-service
          # Image tag is the services repo's commit SHA (ADR 0008/0009,
          # same convention as api/workers) -- bump this one line and open
          # a PR to deploy a new build.
          image: ghcr.io/adamastorx/watchlist-service:0893ce5906d68dca74ce26dfd6a32c4ed0f8f625
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.kafka.svc.cluster.local:9092
            - name: OTLP_COLLECTOR_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4318/v1/traces
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://watchlist-postgresql.watchlist.svc.cluster.local:5432/watchlist
            - name: SPRING_DATASOURCE_USERNAME
              value: watchlist
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: watchlist-postgresql
                  key: password
            # ADR 0026 / backlog #21c: reuses the same already-verified-live
            # ntfy.sh topic Alertmanager posts to, not a second channel.
            # Default in application.yml already matches this value --
            # explicit here for the same "documentation of the real value
            # in use" reason api's own CLINVAR_SERVICE_URL override is.
            - name: NTFY_DEFAULT_TOPIC
              value: adamastorx-alerts-64ec5a92c29196ad
          # Spring Boot Actuator health groups, same shape as api's own
          # Deployment (services#1) -- JVM cold start budget, not a
          # trivial static-binary proof app's.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          # Originally the same starting values as api's own container
          # (platform#35) -- watchlist-service is a comparable-weight
          # Spring Boot workload (webmvc + JPA + spring-kafka + a
          # @Scheduled poll loop), sized defensively before it had ever
          # run on the cluster. It has now run for real: backlog #77
          # re-sizes the CPU *request* against real `kubectl top pod`
          # usage sampled at 3-4m across two reads ~2 min apart, ~1-2% of
          # the original 250m request -- one of the largest gaps found in
          # that node-wide audit. Trimmed to 100m (still >25x observed
          # usage, deliberately generous since this is a JVM workload --
          # the #35 CrashLoopBackOff incident on api was a cold-start CPU
          # story, so headroom here stays wide even though that incident
          # was about api specifically, not this service). CPU *limit*
          # stays at 1 full core, unchanged -- request governs steady-state
          # scheduling weight, limit is what actually bounds a cold-start
          # or GC burst, and this trim doesn't touch it.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
