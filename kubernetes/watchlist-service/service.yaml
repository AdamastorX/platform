apiVersion: v1
kind: Service
metadata:
  name: watchlist-service
  labels:
    app: watchlist-service
spec:
  # ClusterIP only, same trust model as every other in-cluster service here
  # (no auth between services, ADR 0010) -- subscription CRUD is reached at
  # watchlist-service.watchlist.svc.cluster.local, no public Ingress (no
  # caller needs one yet; api's public Ingress precedent, ADR 0021, is
  # exactly the "add one only when there's a real reason" bar).
  type: ClusterIP
  selector:
    app: watchlist-service
  ports:
    - name: http
      port: 80
      targetPort: http
