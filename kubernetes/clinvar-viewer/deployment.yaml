apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinvar-viewer
  labels:
    app: clinvar-viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinvar-viewer
  template:
    metadata:
      labels:
        app: clinvar-viewer
    spec:
      # backlog #142: pod-level defaults every container inherits. UID/GID
      # 101 matches nginxinc/nginx-unprivileged's own baked-in USER
      # (verified against the published image config, not guessed) --
      # pinning the existing runtime identity at the Kubernetes API
      # level, not changing it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clinvar-viewer
          # Image tag is the services repo's commit SHA (ADR 0008/0009) --
          # bump this one line and open a PR to deploy a new build.
          # backlog #56: this build must include app.js/index.html's
          # config.js-and-Authorization-header change for the mount below
          # to have any effect -- see this PR's description for the
          # merge-order note.
          image: ghcr.io/adamastorx/clinvar-viewer:23a6f1d3ca636e3ba198f497fb1d6769507c28d2
          ports:
            - name: http
              containerPort: 8080
          # backlog #142: readOnlyRootFilesystem needs the tmp emptyDir
          # below -- verified against nginxinc/nginx-unprivileged's actual
          # build (its own image history, not guessed): this variant's
          # nginx.conf is already patched to move the pid file and every
          # temp_path directive (proxy/client_body/fastcgi/uwsgi/scgi) to
          # /tmp, specifically so an arbitrary non-root UID can run it
          # without needing /var/cache/nginx to be writable. One /tmp
          # mount covers all of them; nginx creates the subdirectories
          # itself at startup.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          # Static nginx, no external dependency to check -- the
          # container's own listen socket is the whole health signal.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          volumeMounts:
            # backlog #56: this tenant's own key, rendered at deploy time
            # into the exact JS file index.html now loads as config.js
            # (services/clinvar-viewer/index.html/app.js) -- subPath so
            # it lands alongside the image's own baked-in
            # index.html/style.css/app.js without overwriting them.
            # Provisioning: bootstrap/create-stateful-secrets.sh. Stated
            # once more here, not just in app.js: this ends up served to
            # any browser that loads the page (view-source-visible) --
            # a deliberate, documented tradeoff for a client-side-only
            # app with no backend of its own to keep it out of the
            # response, not an accidental leak.
            - name: api-key-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: api-key-config
          secret:
            secretName: clinvar-viewer-api-key
        # backlog #142: tmpfs (Memory-backed) -- pid file + nginx's own
        # temp_path directories, a static site with no proxying/uploads
        # to size against, kept small on purpose.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
