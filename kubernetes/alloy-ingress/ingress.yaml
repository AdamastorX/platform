# Standalone Ingress for Alloy's Faro receiver (backlog #103, ADR 0037)
# -- same "chart with no ingress key of its own" pattern as
# alertmanager-ingress. A real browser (visualizer/clinvar-viewer's own
# Faro Web SDK) can't resolve alloy.alloy.svc.cluster.local, so this
# Ingress is what actually makes the SDK's POST calls reach Alloy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alloy-faro
  labels:
    app: alloy
  annotations:
    cert-manager.io/cluster-issuer: adamastorx-ca
    traefik.ingress.kubernetes.io/router.middlewares: >-
      alloy-alloy-faro-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: faro.local.adamastorx.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alloy
                port:
                  name: faro
  tls:
    - hosts:
        - faro.local.adamastorx.test
      secretName: alloy-faro-tls
