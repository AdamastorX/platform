# platform#35: bounds total consumption of the `api` namespace (api
# Deployment + the postgresql/redis Helm charts, both deployed here per
# ADR 0012/0016) so a runaway pod in this namespace can't eat the whole
# single-node cluster's remaining capacity.
#
# Sized from real usage, not guessed -- `kubectl -n api get pods -o json`
# on the live cluster (2026-07) showed:
#   api:        requests cpu=250m mem=256Mi, limits cpu=1 mem=512Mi (bumped
#               from 500m after a real CrashLoopBackOff -- see
#               deployment.yaml's cpu-limit comment for the incident.
#               CPU *request* left untouched by backlog #77's trim below --
#               #35's own cold-start incident is exactly the reasoning #77
#               excludes api/workers from a request trim over)
#   postgresql: requests cpu=100m mem=512Mi, limits cpu=750m mem=768Mi (backlog
#               #77: CPU request trimmed from the chart's resourcesPreset:
#               small default of 500m -- real usage sampled at 12m, ~2%
#               of that default. Limit/memory untouched)
#   redis:      requests cpu=150m mem=512Mi, limits cpu=750m mem=768Mi (backlog
#               #77: CPU request trimmed from 500m -- real usage sampled
#               at 36-38m. Limit/memory untouched)
# **Updated 2026-08-12 (backlog #122)**: api's own memory bumped again,
# requests mem=256Mi->384Mi, limits mem=512Mi->1024Mi -- a real, live
# OutOfMemoryError crash loop (70 restarts), root-caused to no explicit
# JVM heap sizing (rollout.yaml's own JAVA_TOOL_OPTIONS comment has the
# full account). CPU values unchanged.
# Steady-state totals: requests cpu=500m mem=1408Mi, limits cpu=2500m mem=2560Mi.
# api is the one Deployment here (Postgres/Redis are StatefulSets, no
# surge on update) -- a rolling update temporarily runs two api pods
# (default maxSurge=1), adding +250m/+384Mi requests and +1/+1024Mi
# limits at peak (3500m cpu / 3584Mi memory limits at peak). Quota below
# clears that peak with real headroom, it isn't just steady-state with
# no room for a deploy to happen -- confirmed necessary live, not just
# in theory: this project already hit its own too-tight quota once (the
# CPU limit bump above).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 4Gi
