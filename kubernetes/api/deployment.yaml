apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Image tag is the services repo's commit SHA (ADR 0008/0009) —
          # bump this one line and open a PR to deploy a new build.
          image: ghcr.io/adamastorx/api:a2461e45d1af7295dd4b067002b93c5d3fe3fcfb
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.kafka.svc.cluster.local:9092
            - name: OTLP_COLLECTOR_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4318/v1/traces
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql.api.svc.cluster.local:5432/api
            # Username isn't a secret (just a Postgres role name) --
            # only the password lives in the chart-generated Secret
            # (services#4, ADR 0012).
            - name: SPRING_DATASOURCE_USERNAME
              value: api
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: password
            # services#5, ADR 0016 -- REDIS_HOST default in
            # application.yml already matches this chart's standalone
            # master Service name (redis-master.api.svc.cluster.local),
            # so only the password needs an explicit env var.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: redis-password
            # services#24, ADR 0018 -- same override as workers'
            # deployment.yaml: the PVC below is mounted at /data/refdata,
            # but application.yml's own local-dev default is
            # /data/refdata/clinvar. This PVC exists solely for ClinVar,
            # so the mount root itself is the correct refdata-path.
            - name: CLINVAR_REFDATA_PATH
              value: /data/refdata
          # Spring Boot Actuator health groups (application.yml enables
          # management.endpoint.health.probes) — JVM cold start is slower
          # than whoami's, hence the longer initialDelaySeconds.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            # /data/refdata (services#24, ADR 0018) -- read-only: api only
            # ever reads {refdata-path}/current, never writes; workers
            # (platform#35) is the sole writer via its own ingestion
            # pipeline. Same `workers-refdata` PVC, mounted RWO but shared
            # safely by two Deployments because this single-node cluster
            # always schedules both onto the same node (see workers'
            # pvc.yaml for the full reasoning and the node-count caveat).
            - name: refdata
              mountPath: /data/refdata
              readOnly: true
      volumes:
        - name: refdata
          persistentVolumeClaim:
            claimName: workers-refdata
