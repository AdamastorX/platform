# backlog #46: api migrated from Deployment to a Rollout with a canary
# strategy + automated analysis gate. Everything below that isn't new
# (image, env, probes, resources) is carried over unchanged from the old
# deployment.yaml -- this is a kind change plus a strategy, not a
# redesign of the pod spec.
#
# Why api and not clinvar-service too (the AC's "optionally"): api is
# the one service with a real, already-dated incident this closes
# (the #35 95-minute CrashLoopBackOff) and the one with continuous real
# traffic today (#45's workload-generator hits api directly, not
# clinvar-service). clinvar-service is reached only indirectly (via
# api's own GET /variants/lookup) and has no direct continuous caller of
# its own -- a canary there would have nothing but api's occasional
# proxied calls to analyze, a much weaker live proof. Left as a
# Deployment; a real follow-up once clinvar-service has its own direct
# traffic source.
#
# Canary shape: replicas stay at 1 (matches the existing steady-state
# sizing in resourcequota.yaml/limitrange.yaml -- this migration
# shouldn't silently double baseline capacity). maxSurge: 1,
# maxUnavailable: 0 means the canary pod is a genuine extra pod
# alongside the still-serving stable one, not a replacement of it --
# with only 1 total replica, that's the only way a %-based canary step
# means anything: setWeight: 50 becomes a real 1-stable/1-canary pod
# split, both selected by the *same* Service (api/service.yaml's
# `app: api` selector, unchanged), so traffic actually round-robins
# across both during the canary window. No dedicated stable/canary
# Service or trafficRouting plugin (Traefik weighted routing) --
# deliberately the simplest thing that works for a single-node cluster
# with one Ingress controller, matching this project's own "don't build
# ahead of need" discipline (ADR 0014's reasoning applied here).
#
# Known, stated limitation: because Prometheus scrapes api via its
# Service DNS (argocd/apps/prometheus.yaml's static `api` job target,
# ADR 0014), not per-pod, the AnalysisTemplate below (analysistemplate.yaml)
# measures the *whole Service's* aggregate SLIs during the canary window,
# not the canary pod in isolation -- it cannot distinguish "the new pod
# is bad" from "the old pod got worse" by itself. What it protects
# against directly is the actual #35 incident shape either way: a
# canary pod that never becomes Ready never receives any Service
# traffic (kube-proxy only routes to Ready endpoints) and so never
# contributes a single request to the analysis's own numbers -- that
# specific failure is instead caught by progressDeadlineSeconds +
# progressDeadlineAbort below, a second, complementary safety net, not
# a gap. Splitting Prometheus scraping to per-pod (so the analysis could
# isolate canary-only traffic) is real, valuable follow-on work, out of
# scope here to keep the AC's "reuse the exact existing expressions"
# instruction literal rather than inventing a new scrape/label shape
# alongside it.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api
  # 180s: 2x the existing readiness budget (deployment's own probe:
  # initialDelaySeconds 20 + failureThreshold 6 * periodSeconds 10 = 80s
  # worst-case for a legitimately slow-but-fine JVM cold start, per this
  # file's own probe section below and the #35 incident comment on the
  # old cpu limit). 180s gives that real cold-start budget comfortable
  # headroom while still being short enough that a genuinely stuck pod
  # (CrashLoopBackOff, the #35 shape) is caught in minutes, not the 95
  # minutes the original incident ran silently. progressDeadlineAbort
  # is what turns "stuck" into an *automatic* abort instead of just a
  # Degraded status a human has to notice -- verified live, see
  # docs/runbooks/canary.md.
  progressDeadlineSeconds: 180
  progressDeadlineAbort: true
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      # scaleDownDelaySeconds default (30s) is fine here -- single
      # replica, nothing else depends on the old ReplicaSet staying up
      # any longer than that once the new one is confirmed.
      steps:
        - setWeight: 50
        # Give the analysis a moment of real traffic at the new weight
        # before the first measurement -- otherwise the first Prometheus
        # query could land before any request has actually hit the
        # canary-weighted split.
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: api-slo-check
        - setWeight: 100
  template:
    metadata:
      labels:
        app: api
    spec:
      # backlog #57: fetches the real, published Pyroscope Java agent jar
      # (grafana/pyroscope-java v2.8.0, github release asset) into a
      # shared emptyDir -- an unprivileged init-container/agent-injection
      # pattern, not a rebuilt image and not a privileged DaemonSet
      # attaching from outside the container (see argocd/apps/
      # pyroscope.yaml's own comment for why that alternative was
      # rejected). curlimages/curl runs as its own non-root user by
      # default; nothing here needs root or an elevated capability.
      initContainers:
        - name: pyroscope-agent-fetch
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - curl -fsSL -o /pyroscope-agent/pyroscope.jar https://github.com/grafana/pyroscope-java/releases/download/v2.8.0/pyroscope.jar
          volumeMounts:
            - name: pyroscope-agent
              mountPath: /pyroscope-agent
          # backlog #57 fix: found live -- api's namespace ResourceQuota
          # (kubernetes/api/resourcequota.yaml) sets a memory quota, which
          # requires every container (init containers included) to
          # specify its own requests.memory/limits.memory explicitly --
          # the namespace's LimitRange only auto-defaults CPU, not memory
          # (kubernetes/api/limitrange.yaml). Omitting this blocked the
          # entire Rollout with a real "failed quota" FailedCreate,
          # confirmed live via `kubectl describe rollout api -n api`.
          # Small and fixed: this container does one `curl` and exits.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: api
          # Image tag is the services repo's commit SHA (ADR 0008/0009) —
          # bump this one line and open a PR to deploy a new build. Every
          # such bump now goes through the canary strategy above instead
          # of a plain rolling update.
          # backlog #130 (services#70): GET /work-items gains real
          # pagination -- the old unbounded repository.findAll() was
          # OOMKilling this pod live, 282 restarts over 41h, driven by
          # workload-generator's own ordinary read traffic. This deploy
          # is what actually stops the crash loop; the fix landing in
          # services alone does nothing for the live pod until this ships.
          # backlog #105 (services#74): real, explicit fast-fail timeouts
          # -- HikariCP connection-timeout 3s (was Boot's 30s default),
          # and ClinVarServiceClient's outbound RestClient gains a 2s
          # connect / 3s read timeout it previously had none of at all.
          # A real decision recorded back in 2026-08-09 (ADR 0040) that
          # was never actually coded until now.
          image: ghcr.io/adamastorx/api:e26a01e0ce2796a8b3c0124f249bf2f7878e6a61
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: pyroscope-agent
              mountPath: /pyroscope-agent
              readOnly: true
          env:
            # backlog #57: JAVA_TOOL_OPTIONS is read automatically by any
            # `java` invocation (no ENTRYPOINT change needed, ADR 0009's
            # image stays untouched) -- the JVM prints one harmless
            # "Picked up JAVA_TOOL_OPTIONS" diagnostic line to stderr on
            # start, expected and not an error. The two -XX flags are
            # Pyroscope's own documented recommendation for accurate
            # async-profiler line numbers, not this project's default.
            - name: JAVA_TOOL_OPTIONS
              # backlog #122: real, live OutOfMemoryError crash loop found
              # 2026-08-12 (70 restarts, exitCode 137, "Java heap space"
              # across Tomcat request threads, the Kafka consumer, and
              # Pyroscope's own profile-dump path). Root cause: no
              # explicit heap sizing at all -- the JVM's own cgroup-aware
              # default (MaxRAMPercentage, ~25% of the container memory
              # limit absent an override) left only ~128Mi of real heap
              # for a Spring Boot app running Kafka clients, HikariCP,
              # Tomcat, OTel, and a continuous-profiling agent
              # simultaneously. 75.0 is the standard container-JVM
              # guidance (leaves ~25% of the container's memory for
              # off-heap: metaspace, thread stacks, direct buffers, GC
              # bookkeeping) -- explicit and intentional rather than
              # trusting the conservative unconfigured default a second
              # time.
              value: "-javaagent:/pyroscope-agent/pyroscope.jar -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints -XX:MaxRAMPercentage=75.0"
            - name: PYROSCOPE_APPLICATION_NAME
              value: api
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.pyroscope.svc.cluster.local:4040
            # JFR backend (not the default "collapsed" format) -- Pyroscope's
            # own docs recommend this for production/real use.
            - name: PYROSCOPE_FORMAT
              value: jfr
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.kafka.svc.cluster.local:9092
            - name: OTLP_COLLECTOR_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4318/v1/traces
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql.api.svc.cluster.local:5432/api
            # Username isn't a secret (just a Postgres role name) --
            # only the password lives in the chart-generated Secret
            # (services#4, ADR 0012).
            - name: SPRING_DATASOURCE_USERNAME
              value: api
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: password
            # services#5, ADR 0016 -- REDIS_HOST default in
            # application.yml already matches this chart's standalone
            # master Service name (redis-master.api.svc.cluster.local),
            # so only the password needs an explicit env var.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: redis-password
            # services#24, ADR 0019 -- api no longer touches ClinVar data
            # directly (no PVC, no direct Postgres access); it calls the
            # standalone clinvar-service over HTTP instead, the same
            # service-to-service HTTP pattern ADR 0010 established
            # (originally gateway calling api; gateway itself was removed
            # by ADR 0021/backlog #S1). Default in application.yml already
            # matches this Service DNS, so this override is mostly
            # documentation of the real value in use.
            - name: CLINVAR_SERVICE_URL
              value: http://clinvar-service.clinvar.svc.cluster.local
          # Spring Boot Actuator health groups (application.yml enables
          # management.endpoint.health.probes) — JVM cold start is slower
          # than a trivial static-binary proof app's, hence the longer
          # initialDelaySeconds.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              # backlog #122: memory bumped 256Mi->384Mi alongside the
              # limit bump below -- same real OOM crash loop, real node
              # headroom checked live first (44% memory requested
              # cluster-wide at the time, CPU is the actually-scarce
              # resource here, this doesn't touch it).
              memory: 384Mi
            # platform#35: explicit CPU limit added alongside the existing
            # memory limit -- previously unbounded, so a runaway CPU-bound
            # request handler had no ceiling on a single-node cluster where
            # that directly steals capacity from every other namespace.
            # 2x the request; resourcequota.yaml/limitrange.yaml in this
            # same directory are sized against this value. Canary's
            # maxSurge: 1 briefly adds a second full pod at this same
            # size (already accounted for in resourcequota.yaml's own
            # "rolling update temporarily runs two api pods" headroom
            # comment -- a canary surge pod is the same shape of peak).
            #
            # backlog #122 (2026-08-12): 512Mi->1024Mi, a real, live
            # OutOfMemoryError crash loop (70 restarts, exitCode 137) --
            # see JAVA_TOOL_OPTIONS's own comment above for the root
            # cause (no explicit heap sizing) and the paired
            # MaxRAMPercentage fix. resourcequota.yaml's own hard limits
            # (4Gi limits.memory) already had real headroom for this --
            # checked before picking this number, not assumed.
            limits:
              cpu: "1"
              memory: 1024Mi
      volumes:
        - name: pyroscope-agent
          emptyDir: {}
