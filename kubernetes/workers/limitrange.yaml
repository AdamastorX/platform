# platform#35: workers/deployment.yaml's one container already sets an
# explicit CPU limit, so this is a backstop for anything added later,
# not a fix for a live gap. Default matches workers' own container.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-cpu-limit
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
      defaultRequest:
        cpu: 250m
