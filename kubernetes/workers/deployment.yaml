apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
  labels:
    app: workers
spec:
  # 3-partition/3-replica rebalance captured (services#3 AC, ADR 0011):
  # scaling to 3 replicas assigned each one exactly one partition
  # (generation 6: work-items-0/1/2 -> one consumer each, real cluster,
  # not the embedded-Kafka unit test).
  #
  # platform#35/#37 (ADR 0018) briefly gave workers a PVC and Postgres
  # access for ClinVar ingestion -- reverted here under ADR 0019, which
  # moved all of that into a new standalone `clinvar-service` component
  # after two real cross-namespace bugs (a PVC, then a Postgres Secret,
  # neither shareable across the api/workers namespace boundary) surfaced
  # deploying the original design. workers is back to being purely the
  # M2 work-items Kafka consumer; nothing below references ClinVar.
  #
  # backlog #63: `replicas` is now deliberately ABSENT, not pinned to 1
  # -- KEDA's ScaledObject (scaledobject.yaml, this directory) creates an
  # HPA that writes this field directly, and this Application's
  # syncPolicy.automated.selfHeal (workers.yaml) would otherwise fight
  # every scale event: a git-tracked `replicas: 1` is a standing
  # declaration ArgoCD keeps re-asserting, reverting KEDA's own scale-out
  # within one reconcile the same way this project's chaos scenarios
  # already proved selfHeal reverts any live, uncommitted `kubectl scale`
  # (observability/chaos/03-consumer-lag.md). Omitting the field (not
  # setting it to a sentinel value) is ArgoCD's own documented pattern
  # for a Deployment under external replica control -- a 3-way-merge
  # sync never touches a field that isn't in the applied manifest, so
  # live replica count is left alone. The Deployment API still defaults
  # a brand-new object to 1 replica with no ScaledObject controlling it
  # yet (e.g. before KEDA's Application has synced on a fresh cluster),
  # matching minReplicaCount: 1 in scaledobject.yaml, so first-install
  # ordering doesn't leave workers at 0 replicas by accident either.
  selector:
    matchLabels:
      app: workers
  template:
    metadata:
      labels:
        app: workers
    spec:
      containers:
        - name: workers
          # Image tag is the services repo's commit SHA (ADR 0008/0009) —
          # bump this one line and open a PR to deploy a new build.
          image: ghcr.io/adamastorx/workers:e49be616576c5e0ac64d505132774178624e7371
          ports:
            # No Kubernetes Service for this port (ADR 0009/0011) —
            # workers has no business HTTP API, this exists solely so
            # actuator's health probes below have something to hit.
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.kafka.svc.cluster.local:9092
            - name: OTLP_COLLECTOR_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4318/v1/traces
          # Spring Boot Actuator health groups (application.yml enables
          # management.endpoint.health.probes) — JVM cold start is slower
          # than a trivial static-binary proof app's, hence the longer
          # initialDelaySeconds.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            # platform#35: explicit CPU limit added alongside the existing
            # memory limit -- previously unbounded. 2x the request;
            # resourcequota.yaml/limitrange.yaml in this same directory are
            # sized against this value.
            limits:
              cpu: 500m
              memory: 512Mi
