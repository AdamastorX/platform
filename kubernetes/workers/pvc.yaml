# workers' first PersistentVolumeClaim (platform#35, ADR 0018) -- a real
# precedent shift: every other workload in this repo is stateless
# (gateway/api/workers themselves) or delegates persistence entirely to a
# Bitnami chart (Postgres, ADR 0012). This is the first hand-authored PVC
# for our own app code.
#
# storageClassName: local-path, not left at the chart-style empty-string
# default -- there is no chart here to inherit a cluster default from, and
# being explicit matches this repo's "explicit over magic" preference
# (ADR 0014's scrape config, redis.yaml's architecture/replica settings).
# Confirmed live (`kubectl get sc`): `local-path` is rancher.io/local-path,
# VOLUME_BINDING_MODE=WaitForFirstConsumer, RECLAIM_POLICY=Delete,
# ALLOWVOLUMEEXPANSION=false -- that last one matters: growing past 2Gi
# later means provisioning a new, larger PVC and migrating data across, not
# a live resize. Worth remembering before assuming a future "just bump the
# size" edit is as cheap as it sounds.
#
# accessModes: ReadWriteOnce, NOT ReadWriteMany -- a deliberate, flagged
# deviation from ADR 0018's literal "shared RWX PVC ... mounted on both api
# and workers" wording. rancher.io/local-path is a hostPath-backed
# provisioner: it only ever implements ReadWriteOnce (single node), full
# stop -- there is no RWX mode to request from it, chart or no chart. This
# PR provisions and mounts the PVC on `workers` only, matching this issue's
# (platform#35) narrower scope; mounting it on `api` as well is deferred to
# whichever services-side issue actually implements the lookup endpoint
# reading /data/refdata from api. At that point the RWX-vs-RWO conflict
# needs a real answer, not a silent one:
#   - today, on this single-node cluster, RWO is actually fine even for two
#     Deployments -- ReadWriteOnce restricts the volume to one *node*, not
#     one *pod*, and every pod in this cluster already lands on the same
#     (only) node. Both api and workers could mount this same PVC
#     simultaneously without hitting RWO's real restriction.
#   - that stops being true the moment this cluster gains a second node --
#     at which point either both Deployments need explicit node affinity
#     pinning them together, or the backing storage needs to move to
#     something that genuinely implements RWX (e.g. NFS). Not a problem to
#     solve now on a one-node dev cluster; a problem to not silently forget
#     either, hence writing it down here instead of matching the ADR's
#     literal accessMode and hoping local-path quietly supported it.
#
# 2Gi sizing: ADR 0018's own number, re-checked against live artifact sizes
# rather than trusted blindly -- `curl -sI` against the real NCBI endpoint
# today returned Content-Length 192806479 bytes (~184MiB) for
# clinvar.vcf.gz and 609893 bytes (~596KiB) for its .tbi. Double-buffered
# (a full extra copy held during download-then-swap so a partially-written
# release is never served, per ADR 0018) is ~370MiB -- comfortably inside
# 2Gi with headroom for the gnomAD chr21/22 slice on top. That headroom is
# NOT yet confirmed adequate, though: the public gnomAD v4.1 chr21 *sites*
# VCF alone (`storage.googleapis.com/gcp-public-data--gnomad/...`) measures
# ~7.7GB compressed, not a few hundred MB -- whatever "chr21/22 slice"
# ADR 0018 actually intends for M5 must be a much smaller filtered subset
# (exome-only, region-filtered, or similar), not that full sites file
# unfiltered. That's a services-side ingestion-scope question this PR does
# not resolve; flagged here rather than either guessing a bigger PVC size
# or silently assuming 2Gi already accounts for it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workers-refdata
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
