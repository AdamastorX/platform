# First hand-authored NetworkPolicy anywhere in this repo (platform#35,
# ADR 0018's NCBI-egress requirement). NetworkPolicy objects already exist
# live in this cluster (`kubectl get networkpolicy -A` shows api/postgresql,
# api/redis, and ArgoCD's own install-time policies) but every one of those
# is a Bitnami-chart or ArgoCD-install default, never a deliberate decision
# made in this repo -- this is the first time `platform` itself is
# authoring one, so the trust model this establishes is worth stating
# explicitly rather than adding it quietly as "just another manifest."
#
# Enforcement is PRESUMED, not CONFIRMED. This cluster's Terraform
# (`terraform/main.tf`) runs k3s's stock install script with no CNI
# override visible from this repo -- meaning the default bundled flannel,
# whose NetworkPolicy enforcement comes from k3s's embedded kube-router
# network-policy controller (enabled by default unless the install script
# was passed `--disable-network-policy`, which this repo has no visibility
# into since the script itself lives on the remote host, not in git). The
# existing Bitnami-chart policies above prove such objects at least get
# admitted and reconciled -- nobody has yet proven they actually block a
# packet. Live traffic verification (attempt an egress connection this
# policy should deny, confirm it's actually refused, not just that the
# object shows up via `kubectl get`) is a real follow-up for after merge,
# not assumed to work just because the schema validates -- same discipline
# SESSION_STATE.md documents for "healthy-looking but functionally broken"
# charts generally.
#
# Egress-only (policyTypes: [Egress]) -- workers still has no Service and
# nothing calls it over HTTP (ADR 0009/0011); locking down Ingress too is
# out of scope for what platform#35 actually asks for, and would need
# explicit thought about how kubelet's own liveness/readiness probes reach
# the pod, which this PR isn't taking on.
#
# NetworkPolicy is default-deny-once-selected: the moment ANY policy
# selects `app: workers` for Egress, every egress path this pod already
# relies on stops being implicitly allowed. So this policy has to enumerate
# workers' full *current* egress footprint, not just the new NCBI rule, or
# merging it would silently break the existing Kafka-consumer path (a
# second "policy exists, deployment looks healthy, but is functionally
# broken" trap, this time self-inflicted):
#   - DNS to CoreDNS (kube-system), needed to resolve
#     ftp.ncbi.nlm.nih.gov itself as well as kafka.kafka.svc.cluster.local
#     and otel-collector.otel.svc.cluster.local, both already in use today.
#   - Kafka broker (kafka namespace, :9092) -- the existing consumer path
#     (services#3, ADR 0011).
#   - OTel Collector (otel namespace, :4318) -- the existing trace-export
#     path (observability#1, ADR 0013).
#
# NCBI egress via ipBlock, not a hostname rule -- plain Kubernetes
# NetworkPolicy (networking.k8s.io/v1) has no FQDN-based egress matching at
# all, only podSelector/namespaceSelector/ipBlock. This cluster isn't running
# a CNI with FQDN-aware policy extensions (no Cilium `CiliumNetworkPolicy`
# `toFQDNs`, no Calico `domains` -- just k3s's bundled flannel), so
# "ftp.ncbi.nlm.nih.gov" can't be expressed directly. Pinned instead to its
# currently-resolved IPv4 addresses (`dig +short ftp.ncbi.nlm.nih.gov A`,
# checked live today: 130.14.250.11, 130.14.250.12). This is fragile by
# construction: NCBI can rotate or add addresses without notice, and the
# failure mode is silent -- the weekly refresh just starts failing to
# connect with nothing pointing at this policy as the cause. Accepted for
# now (matches this project's "public reference-data cache, re-downloadable,
# not data loss" risk framing in ADR 0018) but flagged as a real operational
# risk, not a solved problem. Port 443 only (HTTPS) -- confirmed live today
# that NCBI serves clinvar.vcf.gz directly over HTTPS with a 200, no
# redirect through plain FTP/port 21 needed.
#
# Deliberately NOT included: Postgres egress (workers doesn't talk to
# Postgres yet -- ADR 0018's clinvar_release-metadata write path is
# services-side work that hasn't landed; adding a speculative rule for code
# that doesn't exist risks the wrong port/selector when it does, tracked as
# a follow-up for whoever implements that path) and gnomAD's host
# (storage.googleapis.com, Google Cloud Storage -- out of this issue's AC,
# which asked only for ClinVar/NCBI egress; gnomAD's own egress need is
# unresolved, same as its actual artifact size, see pvc.yaml's comments).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workers-egress
spec:
  podSelector:
    matchLabels:
      app: workers
  policyTypes:
    - Egress
  egress:
    # DNS resolution (CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kafka broker -- existing consumer path (ADR 0011).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9092
    # OTel Collector -- existing trace-export path (ADR 0013).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel
      ports:
        - protocol: TCP
          port: 4318
    # ftp.ncbi.nlm.nih.gov (ClinVar host), resolved IPv4 snapshot -- see
    # header comment for why this is IP-pinned and not hostname-based, and
    # the rotation risk that comes with it.
    - to:
        - ipBlock:
            cidr: 130.14.250.11/32
        - ipBlock:
            cidr: 130.14.250.12/32
      ports:
        - protocol: TCP
          port: 443
