# backlog #50: api's own default-deny + explicit allows. Real, derived
# from a live 10-minute `hubble observe -n api` capture (2026-08-10)
# against the rebuilt cluster, cross-checked against api's own real
# source (services/api/src/main/resources/application.yml) --
# unlike clinvar-service's first pass, every observed egress here
# matches a real config value 1:1, no gap found this time.
#
# Applying ANY CiliumNetworkPolicy that selects a pod switches that pod
# from Cilium's default-allow into default-deny for exactly this
# endpoint -- every real flow this pod needs has to be named here, in
# one shot, not added incrementally while traffic is already cut.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: api
  namespace: api
spec:
  endpointSelector:
    matchLabels:
      app: api
  ingress:
    # Traefik -> api (the real public Ingress path, ADR 0021/0027).
    # Real, observed: traefik/traefik -> api/api:8080.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Prometheus scrapes api directly (argocd/apps/prometheus.yaml's api
    # static target). Real, observed: prometheus/prometheus ->
    # api/api:8080.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # DNS, explicitly, everywhere -- backlog #50's own named footgun.
    # Real, observed: api/api -> kube-system/kube-dns:53.
    #
    # rules.dns REMOVED (2026-08-10, real live incident -- this exact
    # rule is what triggered it: a freshly recreated api pod got stuck
    # at Init:Error, ALL DNS failing, not just the intended FQDN). See
    # this item's backlog entry for the full account. A real, open
    # upstream Cilium bug (cilium/cilium#46284-adjacent) makes the DNS
    # proxy L7 redirect drop locally-originated pod DNS under this
    # cluster's tunnel+socket-LB config, independent of
    # dnsProxy.enableTransparentMode -- confirmed live, twice. Plain
    # L3/L4 port-53 allow (below) doesn't trigger the proxy redirect and
    # is unaffected -- normal Service DNS works fine without rules.dns.
    # toFQDNs (the pyroscope-agent-fetch GitHub download) stays blocked
    # until the upstream bug is fixed; see api-pyroscope-agent-egress.yaml,
    # deliberately excluded from this Application's sync
    # (argocd/apps/api-network-policies.yaml).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # api -> clinvar-service (backlog #50's own named minimum). Real,
    # observed: api/api -> clinvar/clinvar-service:8000. Matches
    # application.yml's clinvar.base-url.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: clinvar
            app: clinvar-service
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # api -> Kafka (backlog #50's own named minimum: api/workers -> Kafka
    # -- this is the api half). Real, observed: api/api -> kafka/
    # kafka:9092. Matches application.yml's kafka.bootstrap-servers.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kafka
            app.kubernetes.io/name: kafka
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
    # api -> its own PostgreSQL (backlog #50's own named minimum). Real,
    # observed: api/api -> api/postgresql-0:5432.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: api
            app.kubernetes.io/name: postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # api -> its own Redis (backlog #50's own named minimum). Real,
    # observed: api/api -> api/redis-master-0:6379.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: api
            app.kubernetes.io/name: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # api -> OTel Collector (traces). Real, observed: api/api ->
    # otel/opentelemetry-collector:4318.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: otel
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    # api -> Pyroscope (continuous profiling push, backlog #57). Real,
    # observed: api/api -> pyroscope/pyroscope:4040.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: pyroscope
            app.kubernetes.io/name: pyroscope
      toPorts:
        - ports:
            - port: "4040"
              protocol: TCP
