# backlog #50: kube-state-metrics' own default-deny + explicit allows.
#
# node-exporter, one of the other pods in this namespace, deliberately
# gets NO CiliumNetworkPolicy of its own: prometheus-prometheus-node-
# exporter runs `hostNetwork: true` and shares Cilium's `reserved:host`
# identity with no distinct Cilium endpoint of its own (confirmed live,
# `cilium-dbg endpoint list`) -- a CiliumNetworkPolicy selecting it by
# pod label would not actually be enforced, a real Cilium constraint,
# not an oversight.
# alertmanager, formerly also policy-less (its live `ntfy` webhook
# egress sat in the same toFQDNs/DNS-proxy-blocked class as the NCBI/
# GitHub gap), now has its own egress policy via pure-L3 toCIDR -- see
# alertmanager.yaml in this directory.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  ingress:
    # kubelet's own probes -- livenessProbe targets the "http" port
    # (8080), readinessProbe targets the "metrics" port (8081),
    # confirmed live against the real pod spec.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
    # prometheus-server scrapes both real ports (the chart-default
    # "kubernetes-service-endpoints" job).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
  egress:
    # DNS, explicitly, everywhere -- backlog #50's own named footgun.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-state-metrics' whole job is watching the Kubernetes API to
    # turn cluster object state into metrics -- this single-node k3s
    # cluster serves the API off the node's own IP, no separate pod/LB
    # to target (same reasoning as every other host-bound rule in this
    # item's sibling policies).
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
