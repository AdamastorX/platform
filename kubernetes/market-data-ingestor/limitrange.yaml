# platform#35 pattern: deployment.yaml's one container already sets an
# explicit CPU limit, so this is a backstop for anything added later in
# this namespace, not a fix for a live gap. Default matches this
# service's own container (kubernetes/market-data-ingestor/deployment.yaml).
apiVersion: v1
kind: LimitRange
metadata:
  name: default-cpu-limit
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
      defaultRequest:
        cpu: 250m
