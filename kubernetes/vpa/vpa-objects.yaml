# backlog #101: VerticalPodAutoscaler objects, one per real workload in
# this cluster (Deployment/StatefulSet/DaemonSet, plus the one real
# Rollout, api/api -- Argo Rollouts own CRD implements the real /scale
# subresource VPA needs, confirmed live via
# `kubectl get crd rollouts.argoproj.io -o jsonpath=
# "{.spec.versions[?(@.name==\"v1alpha1\")].subresources}"`).
#
# Every object is `updateMode: "Off"` -- recommendation only, matches
# the deliberate choice in argocd/apps/vpa.yaml (no updater/admission-
# controller deployed at all, so nothing could actuate a recommendation
# even if updateMode said otherwise; belt-and-suspenders, not just one
# knob). A VerticalPodAutoscaler object is namespace-scoped and must
# live in the same namespace as its real target -- every object below
# does.
#
# Generated from the real live workload list
# (`kubectl get deployments,statefulsets,daemonsets -A`, plus the api
# Rollout), 2026-08-11 -- not hand-typed, to avoid a transcription
# mismatch against 50 real object names/kinds/namespaces. Re-generate
# the same way (or add one object by hand, same shape) whenever a real
# workload is added or removed -- nothing here auto-discovers new
# workloads, deliberately: an explicit list here is a real, reviewable
# diff every time the workload roster changes, the same reasoning
# backlog #97's roster-drift check already applies elsewhere in this
# project.
#
# kube-system's own built-in components (coredns, metrics-server,
# local-path-provisioner) are included too, even though this repo does
# not itself define their resource requests (k3s ships them) --
# recommendation-only VPA is pure read-only signal, no reason to
# exclude real workloads from that signal just because we do not
# currently own their manifest.

