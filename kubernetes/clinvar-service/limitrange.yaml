# platform#35: clinvar-service/deployment.yaml's container already sets
# both an explicit CPU and memory limit (it was the one workload that
# already had this right), so this is a backstop for anything added
# later, not a fix for a live gap. Default matches clinvar-service's own
# CPU limit -- the largest single-container CPU allowance in this repo's
# raw manifests, sized for its tabix-indexing ingestion burst.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-cpu-limit
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
      defaultRequest:
        cpu: 250m
