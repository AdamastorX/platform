apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinvar-service
  labels:
    app: clinvar-service
spec:
  # This project's first PVC-backed workload with a single, genuine
  # owner (ADR 0019) -- no RWO/node-pinning caveat worth a comment the
  # way workers' now-removed PVC needed one, since nothing else will
  # ever try to mount this volume. Still node-pinned by local-path's
  # WaitForFirstConsumer binding, still 1 replica for that reason.
  replicas: 1
  selector:
    matchLabels:
      app: clinvar-service
  template:
    metadata:
      labels:
        app: clinvar-service
    spec:
      # backlog #57: pip-installs the real, published `pyroscope-io`
      # package into a shared emptyDir instead of baking it into a
      # rebuilt image -- same unprivileged init-container/agent-injection
      # pattern as kubernetes/api/rollout.yaml, see that file's comment
      # and argocd/apps/pyroscope.yaml's own comment for why (no image
      # rebuild/merge dependency, no privileged DaemonSet). python:3.12-slim
      # matches this service's own Dockerfile base exactly (glibc/ABI
      # match for pyroscope-io's compiled extension) -- confirmed against
      # clinvar-service/Dockerfile before picking this init-container image
      # rather than assumed compatible.
      initContainers:
        - name: pyroscope-agent-install
          image: python:3.12-slim
          command:
            - sh
            - -c
            - pip install --no-cache-dir --target=/pyroscope-deps pyroscope-io
          volumeMounts:
            - name: pyroscope-deps
              mountPath: /pyroscope-deps
          # backlog #57 fix: found live -- same real "failed quota"
          # FailedCreate api's own Rollout hit (see rollout.yaml's
          # matching comment). clinvar's namespace ResourceQuota also
          # sets a memory quota, requiring every container's own
          # requests.memory/limits.memory explicitly.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: clinvar-service
          # Image tag is the services repo's commit SHA (ADR 0008/0009,
          # same convention as api/workers) -- bump this one line
          # and open a PR to deploy a new build. Published by services'
          # build-publish.yml's publish-clinvar-service job (services#35).
          # backlog #122 (services#68): zero-inits the ingestion-status
          # counter's labels so ClinVarIngestionFreshnessBreach's
          # increase() has a real 0 baseline to detect a rise against --
          # code fix only, this bump is what actually puts it live. The
          # in-memory counter doesn't persist across restarts, so the
          # alert clears only once this new pod runs *and* a subsequent
          # real ingestion succeeds against it, not immediately here.
          image: ghcr.io/adamastorx/clinvar-service:fe207ea2c36ae080d4e79af0e01b5a5b70f466d2
          ports:
            - name: http
              containerPort: 8000
          # backlog #57: the image's own ENTRYPOINT (`uvicorn app.main:app
          # ...`) is untouched in the services repo -- overridden here at
          # the Kubernetes level only, wrapping the same call with a
          # one-line pyroscope.configure() first. Equivalent to the
          # original entrypoint otherwise: same module (app.main:app),
          # same host/port.
          command: ["python", "-c"]
          args:
            - |
              import pyroscope
              pyroscope.configure(application_name="clinvar-service", server_address="http://pyroscope.pyroscope.svc.cluster.local:4040")
              import uvicorn
              uvicorn.run("app.main:app", host="0.0.0.0", port=8000)
          env:
            - name: PYTHONPATH
              value: /pyroscope-deps
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.kafka.svc.cluster.local:9092
            - name: OTLP_COLLECTOR_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4318/v1/traces
            - name: CLINVAR_REFDATA_PATH
              value: /data/clinvar
            # Dedicated Postgres instance (clinvar-postgresql.yaml, ADR
            # 0019) -- not api's work_items database. Composed from the
            # five POSTGRES_* vars rather than a single DATABASE_URL,
            # since the chart-generated Secret exposes a password key,
            # not a full DSN -- assembling it as separate vars avoids
            # templating a connection string ourselves.
            - name: POSTGRES_HOST
              value: clinvar-postgresql.clinvar.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: clinvar
            - name: POSTGRES_DB
              value: clinvar
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinvar-postgresql
                  key: password
          # GET /healthz (app/routes/admin.py) confirmed live -- switched
          # off the earlier TCP-only check, which could never detect an
          # unresponsive app (the kernel completes a TCP handshake into
          # the accept queue regardless of whether the app ever calls
          # accept(), so it can't tell a wedged process from a healthy
          # one -- exactly the blind spot a real double-ingestion hit).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          # CPU *limit* bounds the tabix-indexing burst (weekly
          # ingestion), memory covers buffering the ~184MiB compressed
          # VCF during download -- same reasoning platform#37's
          # now-reverted workers sizing used, carried over unchanged since
          # the actual workload moved here, not duplicated from scratch.
          # backlog #77 re-sizes the CPU *request* only: real `kubectl top
          # pod` usage sampled at 27-32m across two reads ~2 min apart
          # (steady-state lookup traffic, no ingestion running during
          # sampling), ~11-13% of the original 250m request. Trimmed to
          # 100m (~3-4x observed steady-state usage) -- the 1-core limit
          # above is what actually has to cover the weekly tabix-indexing
          # burst, and it's unchanged, so this doesn't touch that
          # headroom.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: refdata
              mountPath: /data/clinvar
            - name: pyroscope-deps
              mountPath: /pyroscope-deps
              readOnly: true
      volumes:
        - name: refdata
          persistentVolumeClaim:
            claimName: clinvar-service-refdata
        - name: pyroscope-deps
          emptyDir: {}
