apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinvar-service
  labels:
    app: clinvar-service
spec:
  # This project's first PVC-backed workload with a single, genuine
  # owner (ADR 0019) -- no RWO/node-pinning caveat worth a comment the
  # way workers' now-removed PVC needed one, since nothing else will
  # ever try to mount this volume. Still node-pinned by local-path's
  # WaitForFirstConsumer binding, still 1 replica for that reason.
  replicas: 1
  selector:
    matchLabels:
      app: clinvar-service
  template:
    metadata:
      labels:
        app: clinvar-service
    spec:
      # backlog #57 originally pip-installed the real, published
      # `pyroscope-io` package into a shared emptyDir via an init
      # container instead of baking it into a rebuilt image -- avoided an
      # image rebuild/merge dependency at the time. backlog #50's later
      # default-deny CiliumNetworkPolicy for this namespace
      # (clinvar-network-policies/clinvar-service.yaml) invalidated that
      # tradeoff: the init container's runtime `pip install` needs public
      # PyPI/Fastly egress, which that policy never granted (and
      # deliberately shouldn't -- Fastly's real published range is a
      # large, shared, multi-tenant CDN block, a far broader hole than
      # the dedicated-range NCBI egress this namespace already carries
      # for the real ClinVar download). This was invisible until this
      # pod's first real restart after the policy went live
      # (2026-08-10T17:22:32Z) permanently wedged it at Init:0/1 --
      # confirmed live during services#68's deploy (backlog #122).
      # services#69 moved the install to build time instead (a real
      # manylinux wheel, no compiler needed against this same
      # python:3.12-slim base) -- no init container, no PYTHONPATH
      # override, no pyroscope-deps volume needed anymore.
      containers:
        - name: clinvar-service
          # Image tag is the services repo's commit SHA (ADR 0008/0009,
          # same convention as api/workers) -- bump this one line
          # and open a PR to deploy a new build. Published by services'
          # build-publish.yml's publish-clinvar-service job (services#35).
          # backlog #122 (services#68): zero-inits the ingestion-status
          # counter's labels so ClinVarIngestionFreshnessBreach's
          # increase() has a real 0 baseline to detect a rise against.
          # backlog #122 (services#69): also bakes pyroscope-io into this
          # same image at build time (see the initContainers comment
          # above, now removed). The in-memory counter doesn't persist
          # across restarts, so the alert clears only once this new pod
          # runs *and* a subsequent real ingestion succeeds against it,
          # not immediately on rollout.
          # backlog #132 (services#71): streams variant-index inserts
          # instead of holding a real run's entire ~2.9M rows in memory
          # at once -- the real, confirmed dominant contributor to three
          # consecutive live OOM kills (backlog #131/ADR 0041), all well
          # under this container's own memory limit.
          # backlog #132 (services#72): a fourth real attempt, on
          # services#71's own fix, confirmed that fix working (flat
          # ~88MiB across the whole scan) and isolated the remaining
          # peak to compute_changed_keys' two-full-dict diff step,
          # which now streams against one dict instead.
          image: ghcr.io/adamastorx/clinvar-service:725bbe530e8541d3cdb71b4a60592e7eda2d3efe
          ports:
            - name: http
              containerPort: 8000
          # backlog #57: the image's own ENTRYPOINT (`uvicorn app.main:app
          # ...`) is untouched in the services repo -- overridden here at
          # the Kubernetes level only, wrapping the same call with a
          # one-line pyroscope.configure() first. Equivalent to the
          # original entrypoint otherwise: same module (app.main:app),
          # same host/port. `python` here resolves to the image's own
          # venv (PATH="/opt/venv/bin:$PATH", clinvar-service/Dockerfile)
          # where pyroscope-io now already lives (services#69) -- no
          # PYTHONPATH override needed anymore.
          command: ["python", "-c"]
          args:
            - |
              import pyroscope
              pyroscope.configure(application_name="clinvar-service", server_address="http://pyroscope.pyroscope.svc.cluster.local:4040")
              import uvicorn
              uvicorn.run("app.main:app", host="0.0.0.0", port=8000)
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.kafka.svc.cluster.local:9092
            - name: OTLP_COLLECTOR_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4318/v1/traces
            - name: CLINVAR_REFDATA_PATH
              value: /data/clinvar
            # Dedicated Postgres instance (clinvar-postgresql.yaml, ADR
            # 0019) -- not api's work_items database. Composed from the
            # five POSTGRES_* vars rather than a single DATABASE_URL,
            # since the chart-generated Secret exposes a password key,
            # not a full DSN -- assembling it as separate vars avoids
            # templating a connection string ourselves.
            - name: POSTGRES_HOST
              value: clinvar-postgresql.clinvar.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: clinvar
            - name: POSTGRES_DB
              value: clinvar
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinvar-postgresql
                  key: password
          # GET /healthz (app/routes/admin.py) confirmed live -- switched
          # off the earlier TCP-only check, which could never detect an
          # unresponsive app (the kernel completes a TCP handshake into
          # the accept queue regardless of whether the app ever calls
          # accept(), so it can't tell a wedged process from a healthy
          # one -- exactly the blind spot a real double-ingestion hit).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          # CPU *limit* bounds the tabix-indexing burst (weekly
          # ingestion), memory covers buffering the ~184MiB compressed
          # VCF during download -- same reasoning platform#37's
          # now-reverted workers sizing used, carried over unchanged since
          # the actual workload moved here, not duplicated from scratch.
          # backlog #77 re-sizes the CPU *request* only: real `kubectl top
          # pod` usage sampled at 27-32m across two reads ~2 min apart
          # (steady-state lookup traffic, no ingestion running during
          # sampling), ~11-13% of the original 250m request. Trimmed to
          # 100m (~3-4x observed steady-state usage) -- the 1-core limit
          # above is what actually has to cover the weekly tabix-indexing
          # burst, and it's unchanged, so this doesn't touch that
          # headroom.
          # **Updated 2026-08-12 (backlog #122)**: memory *limit* bumped
          # 768Mi -> 1536Mi -- a real, live OOM (exit 137, confirmed via
          # Prometheus's own container_memory_working_set_bytes: climbed
          # 73MiB -> 767MiB over ~7 real minutes of a real triggered
          # ingestion, killed right at the old 768Mi ceiling, still
          # climbing when killed so the true peak was never observed).
          # The original 768Mi sizing predates continuous profiling
          # (backlog #57) ever being validated against a full real
          # ingestion run at this memory ceiling together, and/or ClinVar's
          # real upstream VCF has grown since that sizing was last
          # checked -- either way, real evidence, not a guess. Doubled
          # rather than trimmed to the observed peak, since the true peak
          # is unknown (still rising at kill time) and ClinVar's release
          # size is expected to keep growing over time. Request
          # untouched -- backlog #77's steady-state (non-ingestion)
          # sampling is unaffected by a burst-only ceiling change.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: refdata
              mountPath: /data/clinvar
      volumes:
        - name: refdata
          persistentVolumeClaim:
            claimName: clinvar-service-refdata
