# Bounds total consumption of the `sentiment-analyzer` namespace -- one
# Deployment, no dedicated Postgres (this service is deliberately
# stateless, see services/sentiment-analyzer/README.md), same shape as
# news-ingestor's own quota.
#
# Never run on this cluster before this PR, so deployment.yaml's request/
# limit are a defensive starting estimate (same news-ingestor/
# market-data-ingestor precedent before backlog #77's real
# kubectl-top-based trim) -- steady-state: requests cpu=250m mem=256Mi,
# limits cpu=500m mem=512Mi. A rolling update (default maxSurge=1,
# single-replica Deployment) briefly doubles that at peak: requests
# cpu=500m mem=512Mi, limits cpu=1000m mem=1024Mi. Quota below clears
# that real peak with a small margin, not padded further -- re-tighten
# against real `kubectl top pod` usage once this has actually run live,
# the same way backlog #77 did for watchlist-service/workers.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
spec:
  hard:
    requests.cpu: 600m
    requests.memory: 640Mi
    limits.cpu: 1200m
    limits.memory: 1280Mi
