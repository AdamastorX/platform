apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-analyzer
  labels:
    app: sentiment-analyzer
spec:
  # One replica, explicit and pinned -- same reasoning
  # market-data-ingestor's own deployment.yaml states for itself, applied
  # here to a Kafka consumer group instead of a websocket subscription: a
  # second replica joining consumer group "sentiment-analyzer" (one
  # partition on news.article.published, ADR 0011's "no more partitions
  # than a single producer/consumer pair needs yet" convention, see
  # argocd/apps/kafka.yaml) would sit idle -- Kafka only ever hands a
  # given partition to one group member at a time, so a second replica
  # buys no throughput today. No KEDA ScaledObject for the same reason
  # `workers` has one and this doesn't: workers' work-items topic has 3
  # partitions and real, bursty synthetic load to scale against; this
  # topic has 1 partition and this milestone's real traffic (a handful of
  # matched articles per news-ingestor poll cycle) -- add both together
  # if #80's consumer group ever actually needs the parallelism,
  # matching the exact same "add partitions/replicas later, not
  # speculatively now" note already left on news.article.published's own
  # topic entry.
  replicas: 1
  selector:
    matchLabels:
      app: sentiment-analyzer
  template:
    metadata:
      labels:
        app: sentiment-analyzer
    spec:
      # backlog #142: pod-level defaults every container inherits. UID/GID
      # 10001 matches this image's own baked-in USER (sentiment-analyzer/
      # Dockerfile) -- pinning the existing runtime identity at the
      # Kubernetes API level, not changing it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentiment-analyzer
          # Image tag is the services repo's commit SHA (ADR 0008/0009,
          # same convention as every other service here) -- bump this one
          # line and open a PR to deploy a new build.
          #
          # Real tag: services#50 merged (squash, plus a review-time fix
          # guarding the consumer loop against an uncaught scoring
          # exception), build-publish published this image for the real
          # merge-commit SHA on services' main.
          # Real tag: services#60 (backlog #90) -- adds the real
          # sentiment_analyzer_consumer_lag Gauge, fed from librdkafka's
          # own statistics.interval.ms/stats_cb (confluent-kafka's
          # Python client has no automatic Prometheus lag export the
          # way Micrometer's binders give the Java services for free).
          image: ghcr.io/adamastorx/sentiment-analyzer:4693f6088c2d27afdbcb54515ab56e0932cd93a3
          ports:
            # No Kubernetes Service for this port (ADR 0009/0011, same as
            # news-ingestor/market-data-ingestor/workers) -- this service
            # has no business HTTP API for another service to call. It
            # exists so /healthz (liveness/readiness) and /metrics
            # (Prometheus, argocd/apps/prometheus.yaml's pod-role scrape)
            # have something to hit.
            - name: http
              containerPort: 8000
          # backlog #142: readOnlyRootFilesystem needs no extra tmpfs mount
          # -- audited this module's own source, not assumed: no file
          # write anywhere in app/ (grepped for FileHandler/open(...'w')/
          # tempfile/makedirs, none found). VADER's lexicon is bundled
          # read-only inside vaderSentiment's own site-packages install;
          # librdkafka's stats are pulled via the stats_cb callback (see
          # this file's own comment above), never written to a stats file.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.kafka.svc.cluster.local:9092
            - name: OTLP_COLLECTOR_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4318/v1/traces
          # FastAPI/uvicorn cold start is real but far lighter than a JVM
          # service's -- no class-loading/JIT-warmup budget needed, but
          # this app's lifespan also has to construct a confluent-kafka
          # Consumer/Producer and start the background consumer thread
          # before /healthz meaningfully reflects "actually consuming",
          # so this still gets a real (if shorter than the JVM services')
          # initialDelaySeconds rather than assuming instant readiness.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          # Never run on this cluster before this PR, so this is a
          # defensive starting estimate -- same discipline every other
          # first-deploy service here uses (re-tighten against real
          # `kubectl top pod` usage once this has actually run live, the
          # backlog #77 precedent). CPU *request* matches news-ingestor's
          # own first-deploy sizing exactly (250m) per this backlog
          # item's own stated guidance -- no real reason to size a
          # single-partition Kafka consumer running sub-millisecond VADER
          # scoring any higher. CPU *limit* set to 500m, not
          # news-ingestor's 1-core -- that 1-core limit exists to cover a
          # JVM's own startup/JIT-warmup burst, which a Python/uvicorn
          # process has no equivalent of; 500m matches
          # market-data-ingestor's own already-established limit for a
          # comparably-shaped "no burst compute, continuous small
          # workload" service instead. Memory matches news-ingestor's
          # request (256Mi) and market-data-ingestor's/clinvar-service's
          # own limit class (512Mi) -- VADER's lexicon is loaded once at
          # startup and is small (a few MB), no large in-memory buffers
          # anywhere in this service's own code.
          # CPU request trimmed 250m -> 80m (backlog #120, 2026-08-09,
          # same #77-style discipline: measured, not guessed). Real
          # 7-day max_over_time CPU rate (cAdvisor via Prometheus,
          # sum(rate(container_cpu_usage_seconds_total[5m])) maxed over
          # 7d) was 8.8m -- ~9x margin at 80m, just above #77's own 3-8x
          # precedent band (more conservative, not less). Memory left
          # untouched (#77's own convention):
          # real peak (101.6Mi) already has comfortable room under 256Mi.
          resources:
            requests:
              cpu: 80m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
