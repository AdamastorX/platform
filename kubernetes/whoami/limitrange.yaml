# platform#35: whoami/deployment.yaml's one container already sets an
# explicit CPU limit, so this is a backstop for anything added later,
# not a fix for a live gap. Default matches whoami's own container --
# this is the trivial ingress-proof app (README, ADR 0009-era), sized
# tiny on purpose.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-cpu-limit
spec:
  limits:
    - type: Container
      default:
        cpu: 50m
      defaultRequest:
        cpu: 10m
