apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  labels:
    app: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            # platform#35: explicit CPU limit added alongside the existing
            # memory limit -- previously unbounded. Same 5x request:limit
            # ratio this trivial proof app's memory limit already used.
            limits:
              cpu: 50m
              memory: 32Mi
