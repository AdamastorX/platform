# backlog #50: alloy's own default-deny + explicit allows. Real,
# derived from a live 5-minute `hubble observe --namespace alloy`
# capture (2026-08-10) against the rebuilt cluster.
#
# No real ingress caller: nothing calls alloy (a log-shipping
# DaemonSet, no Kubernetes Service, no `prometheus.io/scrape`
# annotation -- confirmed live, `kubectl get pod -n alloy alloy-nl2sx
# -o jsonpath='{.metadata.annotations}'` -- so Prometheus's generic
# annotation-driven jobs don't pick it up either).
#
# CORRECTION (2026-08-10, real finding from backlog #50's own
# closure): an earlier version of this file simply omitted the
# `ingress:` key, on the assumption that meant real default-deny with
# zero allows. Confirmed live to be WRONG -- `cilium-dbg endpoint list`
# showed this endpoint's `policy-enabled` as `egress` only, never
# `both`; Cilium does not enable ingress enforcement for an endpoint
# unless the policy actually contains at least one real ingress rule
# object. An omitted key (or an explicitly empty `ingress: []`, also
# tested live) leaves ingress completely unenforced -- real
# default-ALLOW, the opposite of the original intent, though with no
# live exposure found (nothing legitimately or illegitimately calls
# alloy today). Fixed with a real ingress rule below that structurally
# exists but can never match anything real -- confirmed live this
# flips `policy-enabled` to `both`, the genuine default-deny-zero-
# allows posture originally intended.
#
# No rules.dns/toFQDNs (backlog #50's own real, live DNS-proxy
# incident -- see this item's backlog entry and clinvar-service.yaml/
# api.yaml in the sibling directories): alloy has no public egress, so
# this was never at risk, but the plain L3/L4-only DNS rule below
# matches the now-established safe pattern anyway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy
  namespace: alloy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  ingress:
    # No real ingress caller exists (see header) -- this rule's own
    # selector is written to never match a real namespace, purely to
    # make Cilium actually enforce ingress default-deny (see header's
    # CORRECTION for why an absent/empty ingress list doesn't do this
    # on its own). If a real caller is ever needed, replace this
    # placeholder with that caller's own real fromEndpoints rule rather
    # than adding a second ingress entry alongside it.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: this-namespace-never-exists-by-design
  egress:
    # DNS, explicitly, everywhere -- backlog #50's own named footgun.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # alloy -> Loki (backlog #50's own named minimum: this is it). Real,
    # observed: alloy/alloy -> loki/loki-0:3100 (log push, the Loki
    # write path).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: loki
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # alloy -> the Kubernetes API server, for its own `discovery.
    # kubernetes` component (watches pod/node changes cluster-wide to
    # know what to tail/scrape). Real, observed: alloy/alloy ->
    # 192.168.1.10:6443, identity resolved as `(host)` -- this single-
    # node k3s cluster serves the API directly off the node's own IP,
    # no separate API-server pod/LB to target with a label selector
    # (same `host` entity used, in reverse, by workers.yaml's kubelet
    # ingress rule).
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
