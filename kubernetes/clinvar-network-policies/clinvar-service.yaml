# backlog #50: clinvar-service's own default-deny + explicit allows,
# derived from real observed Hubble flows (2026-08-10, `hubble observe
# --since 5m -o json` against the live rebuilt cluster) cross-checked
# against the real architecture, not guessed from the docs alone --
# the gap between the two (see below) is itself part of this item's AC.
#
# Applying ANY CiliumNetworkPolicy that selects a pod switches that pod
# from Cilium's default-allow into default-deny for exactly this
# endpoint -- every real flow this pod needs has to be named here, in
# one shot, not added incrementally while traffic is already cut.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: clinvar-service
  namespace: clinvar
spec:
  endpointSelector:
    matchLabels:
      app: clinvar-service
  ingress:
    # api -> clinvar-service (backlog #50's own named minimum: this is
    # it). Real, observed: api/api -> clinvar/clinvar-service:8000.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: api
            app: api
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Prometheus scrapes clinvar-service directly (argocd/apps/
    # prometheus.yaml's clinvar-service static target). Real, observed:
    # prometheus/prometheus -> clinvar/clinvar-service:8000.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # DNS, explicitly, everywhere -- backlog #50's own named footgun.
    # Real, observed: clinvar/clinvar-service -> kube-system/kube-dns:53
    # (implied by every other successful egress below; not directly
    # captured as its own log line in the 5-minute sample, but this is
    # the one flow this project's own real architecture makes certain
    # rather than assumed -- every service here resolves Service DNS
    # names for everything it calls).
    #
    # rules.dns REMOVED (2026-08-10, real live incident -- see this
    # item's backlog entry): an L7 DNS visibility rule here is what
    # toFQDNs needs to populate its IP allow-list, but a real, open
    # upstream Cilium bug (cilium/cilium#46284-adjacent) makes the DNS
    # proxy L7 redirect itself drop locally-originated pod DNS under
    # this cluster's real tunnel+socket-LB config -- confirmed live,
    # twice, independent of the dnsProxy.enableTransparentMode setting.
    # Plain L3/L4 port-53 allow (below) does not trigger the proxy
    # redirect at all and is unaffected -- normal Service/in-cluster DNS
    # works fine without rules.dns. toFQDNs (NCBI) stays genuinely
    # blocked until the upstream bug is fixed; see
    # clinvar-service-ncbi-egress.yaml, deliberately excluded from this
    # Application's sync (argocd/apps/clinvar-network-policies.yaml).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # clinvar-service -> Kafka (produces to clinvar.ingestion.completed,
    # watchlist-service's own real trigger topic, ADR 0026/backlog #53).
    # CRITICAL review finding: missing from the original version of this
    # policy entirely -- clinvar-service holds a real, live, established
    # connection to kafka-controller-0:9092 (confirmed against the pod's
    # own live socket table, not just Hubble's short flow buffer, which
    # can miss an already-established long-lived connection). Applying
    # the policy without this would have cut real production traffic on
    # apply -- caught by review before that happened, not after.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kafka
            app.kubernetes.io/name: kafka
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
    # clinvar-service -> its own PostgreSQL. Real, observed:
    # clinvar/clinvar-service -> clinvar/clinvar-postgresql-0:5432.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: clinvar
            app.kubernetes.io/name: postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # clinvar-service -> OTel Collector (traces). Real, observed:
    # clinvar/clinvar-service -> otel/opentelemetry-collector:4318.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: otel
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    # clinvar-service -> Pyroscope (continuous profiling push, backlog
    # #57). Real, observed: clinvar/clinvar-service ->
    # pyroscope/pyroscope:4040.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: pyroscope
            app.kubernetes.io/name: pyroscope
      toPorts:
        - ports:
            - port: "4040"
              protocol: TCP
    # clinvar-service -> NCBI (the only permitted public egress in the
    # cluster, backlog #50's own AC): written (clinvar-service-ncbi-
    # egress.yaml) but NOT applied -- excluded from this Application's
    # sync (argocd/apps/clinvar-network-policies.yaml) since it needs
    # the still-broken rules.dns L7 DNS proxy path (see above). A real,
    # stated, temporarily-unenforceable gap, not a silent omission: the
    # real ClinVar ingestion job (services/clinvar-service, config.py,
    # CLINVAR_SOURCE_VCF_URL=https://ftp.ncbi.nlm.nih.gov/pub/clinvar/
    # vcf_GRCh38/clinvar.vcf.gz) keeps its current unrestricted egress
    # until the upstream Cilium bug is fixed and this rule can actually
    # be turned on.
