# Never run on this cluster before this PR, so deployment.yaml's
# request/limit are a defensive starting estimate (see that file's own
# honest resource-sizing/headroom flag). Steady-state: requests
# cpu=100m mem=256Mi, limits cpu=500m mem=768Mi. A rolling update
# (default maxSurge=1, single-replica Deployment) briefly doubles that
# at peak: requests cpu=200m mem=512Mi, limits cpu=1000m mem=1536Mi.
# Quota below clears that real peak with a small margin, not padded
# further -- re-tighten against real `kubectl top pod` usage once this
# has actually run live, the same backlog #77 discipline every other
# service here followed.
#
# 2026-10-06: the memory numbers above were resized after measuring (working
# set 690-746Mi of the 768Mi limit for a week, OOMKilled 2026-10-04): steady
# state is now requests mem=768Mi, limits mem=1536Mi (kubernetes/mimir/
# deployment.yaml). The rolling-update peak (maxSurge=1 doubles it) is then
# requests mem=1536Mi and limits mem=3072Mi, so the memory quota below is
# raised to clear that peak with the same small margin; CPU is unchanged.
# Left at the old 640Mi/1792Mi the new pod would be rejected outright
# ("exceeded quota"), so this file must change together with deployment.yaml.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
spec:
  hard:
    requests.cpu: 300m
    requests.memory: 1792Mi
    limits.cpu: 1200m
    limits.memory: 3328Mi
