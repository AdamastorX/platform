apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-generator
  labels:
    app: workload-generator
spec:
  # 1 replica: this is one continuous stream of shaped traffic at a
  # single configured rate, not something that benefits from scaling --
  # two replicas would just double the rate behind ConfigMap-set numbers
  # that already say what the rate should be, silently drifting the
  # actual load away from what the ConfigMap documents.
  replicas: 1
  selector:
    matchLabels:
      app: workload-generator
  template:
    metadata:
      labels:
        app: workload-generator
    spec:
      containers:
        - name: workload-generator
          # Image tag is the services repo's commit SHA (ADR 0008/0009,
          # same convention as api/workers/clinvar-service) -- bump this
          # one line and open a PR to deploy a new build. First deploy of
          # this component (backlog #45): the SHA below is
          # services#backlog-45-workload-generator's branch tip at the
          # time this manifest was written, published by services'
          # build-publish.yml once that PR merges to main -- this
          # platform Application's initial sync only succeeds after that
          # image exists in ghcr.io. If the services PR merges via squash
          # (a new SHA, not this one) rather than merge/rebase, this line
          # needs a one-line follow-up bump to the real merged SHA before
          # ArgoCD can sync successfully -- called out explicitly so it
          # isn't a silent post-merge surprise.
          # backlog #56: bump this SHA together with the code change in
          # services#<PR> that adds the Authorization header
          # (generator/client.py) -- this manifest's API_BASE_URL/API_KEY
          # below only work against that build. See this PR's description
          # for the merge-order note (services PR + image bump land
          # before this Ingress's auth middleware is enforced).
          image: ghcr.io/adamastorx/workload-generator:23a6f1d3ca636e3ba198f497fb1d6769507c28d2
          env:
            # backlog #56: switched from the in-cluster Service DNS this
            # used before (http://api.api.svc.cluster.local) to api's
            # public Ingress hostname, over HTTPS -- so this generator's
            # synthetic traffic is subject to the same edge auth/rate
            # limiting as every other public caller and attributable by
            # its own key there too, not only via the traffic_source
            # metric label. hostAliases below resolves this hostname
            # in-cluster (no public DNS, ADR 0004/cert-manager-issuers/
            # README.md) to the node's real IP -- the same
            # 192.168.1.10 already used as Traefik's own
            # providers.kubernetesIngress.ingressEndpoint.ip
            # (argocd/apps/traefik.yaml) and reachable from any pod on
            # this single-node cluster the same way a LAN client reaches
            # it.
            - name: API_BASE_URL
              value: https://api.local.adamastorx.test
            - name: CONFIG_PATH
              value: /etc/workload-generator/config.json
            - name: HEARTBEAT_PATH
              value: /tmp/workload-generator-heartbeat
            # This tenant's own key (backlog #56 AC) -- sourced from a
            # real Secret via secretKeyRef, never hardcoded here.
            # Provisioning: bootstrap/create-stateful-secrets.sh.
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: workload-generator-api-key
                  key: api-key
            - name: CA_BUNDLE_PATH
              value: /etc/workload-generator/ca/ca.crt
          # No ports -- this component makes only outbound calls (backend-
          # engineer.md/platform-engineer.md's "simplest thing that works"
          # AC allowance: a container running a script). Health is a
          # heartbeat-file exec probe (generator/healthcheck.py), not
          # httpGet, for the same reason.
          livenessProbe:
            exec:
              # "python", not "python3" -- matches the Dockerfile's own
              # ENTRYPOINT exactly (the official python:3.12-slim image
              # symlinks python -> python3, but there's no reason to rely
              # on both names resolving when one is already proven to
              # work by the container actually starting at all).
              command: ["python", "-m", "generator.healthcheck"]
            # Generous initialDelaySeconds even though this process's own
            # startup is near-instant (no JVM cold start, no
            # Hibernate/Flyway/Kafka bootstrapping the way api's #35
            # incident hit) -- kept anyway as a deliberate margin, not
            # tuned down to the observed ~1s startup, since a heartbeat
            # probe firing before the first loop tick has ever run would
            # be a false negative for a reason that has nothing to do
            # with this container's health.
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            # Sized from a real local run against the live cluster's api
            # Service (port-forwarded), not guessed -- applying the #35
            # lesson to a component #35 itself never touched. Measured via
            # `ps`/`/proc/<pid>/status` over several minutes at a
            # deliberately faster-than-production rate (2 req/s, vs this
            # ConfigMap default's 0.5 req/s peak, to get a faster/harder
            # signal): steady-state RSS ~32MB (stable, no growth observed),
            # CPU ~0.5-0.6% of one core. No JVM-style cold-start burst
            # here at all -- a plain CPython interpreter with `requests`
            # imported starts in a small fraction of a second, nothing
            # like api's Hibernate/Flyway/Kafka-bootstrap startup path.
            # Limits below are roughly 4x the measured steady-state
            # memory and a full order of magnitude over measured CPU, for
            # headroom against a slower production host and Python's own
            # GC/allocator variance, while staying nowhere near "unbounded"
            # on a namespace whose whole point is to be a low-key,
            # low-priority consumer of node capacity.
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            # ConfigMap volume, not envFrom/a plain env var -- kubelet
            # keeps a mounted ConfigMap's files in sync with the object in
            # the API server (periodic sync, ~60s default) without a pod
            # restart, which env vars fundamentally can't do. This is
            # what makes generator/config.py's per-tick re-read (see that
            # module's docstring) actually observe a ConfigMap edit live,
            # satisfying backlog #45's "Rate is a single configurable
            # value that can be turned down to near-zero without a
            # redeploy".
            - name: config
              mountPath: /etc/workload-generator
              readOnly: true
            # backlog #56: the project's private CA root, mirrored into
            # this namespace by the bootstrap script (it's public data,
            # a ConfigMap not a Secret -- see that script's own comment)
            # so `requests` can verify api's Ingress certificate instead
            # of either failing closed or skipping verification.
            - name: ca-bundle
              mountPath: /etc/workload-generator/ca
              readOnly: true
      # backlog #56: api.local.adamastorx.test has no public DNS record
      # (ADR 0004) -- it only ever resolved via a client's own
      # /etc/hosts or --resolve flag (cert-manager-issuers/README.md).
      # In-cluster, CoreDNS has no record for it either, so this pod
      # needs its own static mapping to actually reach the hostname it
      # now authenticates and connects to by name (required for correct
      # TLS SNI/hostname verification against the CA-issued cert -- see
      # ca-bundle above). Same real node IP Traefik itself is configured
      # with (argocd/apps/traefik.yaml's ingressEndpoint.ip); reachable
      # from any pod on this single-node cluster via hostPort 80/443 the
      # same way an external LAN client reaches it.
      hostAliases:
        - ip: "192.168.1.10"
          hostnames:
            - "api.local.adamastorx.test"
      volumes:
        - name: config
          configMap:
            name: workload-generator-config
        - name: ca-bundle
          configMap:
            name: adamastorx-ca
