apiVersion: v1
kind: Service
metadata:
  name: aggregator
  labels:
    app: aggregator
spec:
  # ClusterIP still -- this Service itself is unchanged (in-cluster
  # Service DNS backs the real Ingress below, same shape api's own
  # service.yaml/ingress.yaml pair already uses). backlog #82
  # (visualizer) is now real: see ingress.yaml (new, this PR) for the
  # public Ingress and middlewares.yaml (new, this PR) for the CORS
  # config a real browser needs to call this from visualizer's own
  # origin -- both were deliberately deferred out of this file until #82
  # existed to name a real caller/origin for (ADR 0021, this file's own
  # previous comment), not an oversight now being filled in.
  type: ClusterIP
  selector:
    app: aggregator
  ports:
    - name: http
      port: 80
      targetPort: http
