name: Renovate

# backlog #98: self-hosted Renovate (renovatebot/github-action), not the
# GitHub App -- avoids an org-level app install this agent can't grant
# itself, and each repo's own GITHUB_TOKEN is already scoped correctly
# (nothing cross-repo needed since each repo manages only its own
# dependencies).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # backlog #98, found live in the same run that proved the
  # RENOVATE_REPOSITORIES fix above works: real PRs opened
  # successfully, but the job also logged "Could not ensure issue"
  # (err: integration-unauthorized) trying to create/update the
  # Dependency Dashboard issue -- that needs issues:write, which this
  # workflow never granted.
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: renovatebot/github-action@v46.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # backlog #98 real bug, found live 2026-08-17: both scheduled
          # runs since this workflow shipped (2026-08-10, 2026-08-17)
          # completed "success" with zero PRs opened, across every repo
          # -- the job log's own output shows why: "WARN: No repositories
          # found - did you want to run with flag --autodiscover?". The
          # action never told Renovate which repository to scan; it
          # doesn't infer this from GITHUB_REPOSITORY on its own the way
          # the original config assumed. RENOVATE_REPOSITORIES is
          # renovatebot/github-action's own documented fix for exactly
          # this shape of silent no-op.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
