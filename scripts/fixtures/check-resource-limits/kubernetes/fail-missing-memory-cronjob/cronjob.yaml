apiVersion: batch/v1
kind: CronJob
metadata:
  name: fail-missing-memory-cronjob
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: app
              image: example/app:1.0.0
              resources:
                requests:
                  cpu: 100m
                limits:
                  cpu: 500m
